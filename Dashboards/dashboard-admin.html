<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stappando · Dashboard Admin (super/owner)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sidebar-bg:#003d4d;
  --primary:#005f73;
  --primary-dark:#003d4d;
  --accent:#c9a87c;
  --bg:#f7f3ee;
  --card:#ffffff;
  --fg:#1a1a1a;
  --muted-fg:#7a7060;
  --muted:#f0ebe3;
  --border:rgba(0,0,0,.09);
  --border-soft:rgba(0,0,0,.06);
  --root:#7f1d1d;
  --r:16px;
  --r-sm:12px;
  --r-lg:24px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.07);
  --shadow-lg:0 12px 40px rgba(0,0,0,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--fg);
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
ul{list-style:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── shell ───────────────────────────────────────────── */
#root{display:flex;height:100vh;overflow:hidden}

.sidebar{
  width:248px;flex:none;background:var(--sidebar-bg);
  display:flex;flex-direction:column;height:100%;
}
.sb-logo{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo{color:#fff;font-weight:800;letter-spacing:.14em;font-size:15px;line-height:1}
.logo em{font-style:normal;color:var(--accent)}
.logo-sub{font-size:8px;letter-spacing:.34em;color:rgba(255,255,255,.5);margin-top:5px;font-weight:500}
.sb-cantina{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px}
.sb-avatar{width:36px;height:36px;border-radius:999px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.sb-cantina p{color:#fff;font-size:13px;font-weight:600;line-height:1.2}
.role-chip{display:inline-block;margin-top:4px;font-size:10px;font-weight:600;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.2);color:#fff}
.role-chip.root{background:rgba(239,68,68,.28);color:#fecaca}

.sb-nav{flex:1;padding:16px 12px;overflow-y:auto}
.sb-label{padding:0 12px;margin-bottom:8px;color:rgba(255,255,255,.32);font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:500}
.sb-label.root{color:rgba(252,165,165,.6)}
.sb-item{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);font-size:14px;color:rgba(255,255,255,.6);transition:.15s;text-align:left}
.sb-item:hover{color:#fff;background:rgba(255,255,255,.08)}
.sb-item.on{background:rgba(255,255,255,.15);color:#fff;font-weight:500}
.sb-item.root.on{background:rgba(239,68,68,.18);color:#fff}
.sb-item .chev{margin-left:auto;color:rgba(255,255,255,.4)}
.sb-item .cnt{margin-left:auto;min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sb-sep{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.sb-foot{padding:16px 12px;border-top:1px solid rgba(255,255,255,.1)}
.sb-logout{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);font-size:14px;color:rgba(255,255,255,.5);transition:.15s}
.sb-logout:hover{color:#fca5a5;background:rgba(239,68,68,.1)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.header{
  height:56px;flex:none;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 24px;z-index:10;
}
.header h1{font-size:16px;font-weight:600;flex:1;min-width:0}
.mob-logo{display:none}
.roleswitch{position:relative}
.rs-btn{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;transition:.15s}
.rs-btn:hover{background:var(--muted)}
.rs-badge{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.rs-txt p:first-child{font-size:12px;font-weight:600;line-height:1}
.rs-txt p:last-child{font-size:10px;color:var(--muted-fg);margin-top:3px;line-height:1}
.rs-menu{position:absolute;right:0;top:calc(100% + 6px);width:300px;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden;z-index:40}
.rs-menu-h{padding:12px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.1em}
.rs-opt{width:100%;display:flex;gap:12px;padding:14px 16px;text-align:left;transition:.15s}
.rs-opt:hover{background:rgba(0,0,0,.03)}
.rs-opt.on{background:rgba(0,95,115,.05)}
.rs-opt-ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex:none;margin-top:2px}
.rs-opt-t{display:flex;align-items:center;gap:8px}
.rs-opt-t p{font-size:13px;font-weight:600}
.rs-opt-t span{font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px;color:#fff}
.rs-opt-s{font-size:11px;color:var(--muted-fg);margin-top:3px;line-height:1.4}
.bell{position:relative;padding:8px;border-radius:var(--r-sm);color:rgba(26,26,26,.7);transition:.15s;flex:none}
.bell:hover{background:var(--muted)}
.bell b{position:absolute;top:5px;right:5px;width:16px;height:16px;border-radius:999px;background:#ef4444;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}

.content{flex:1;overflow-y:auto;padding:24px}
.wrap{max-width:1020px;margin:0 auto}
.wrap-sm{max-width:840px;margin:0 auto}
.wrap-lg{max-width:1180px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:20px}
.stack-sm{display:flex;flex-direction:column;gap:12px}

/* ── generic ─────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.card-h h3{font-size:14px;font-weight:600}
.link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--primary)}
.link:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r-sm);font-size:14px;font-weight:500;transition:.15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{border:1px solid var(--border);color:var(--muted-fg);background:#fff}
.btn-ghost:hover{background:var(--muted)}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-root{background:var(--root);color:#fff}
.btn-root:hover{opacity:.9}
.muted{color:var(--muted-fg)}
.eyebrow{font-size:11px;font-weight:600;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.1em}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}

.input{width:100%;padding:10px 16px;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;font-size:14px;outline:none;transition:.15s}
.input:focus{border-color:rgba(0,95,115,.4);box-shadow:0 0 0 3px rgba(0,95,115,.12)}
.search{position:relative;flex:1;min-width:190px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted-fg)}
.search input{padding-left:36px}
.field label{display:block;margin-bottom:6px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-sm);font-size:12px;font-weight:500;border:1px solid var(--border);background:#fff;color:var(--muted-fg);white-space:nowrap;flex:none;transition:.15s}
.chip:hover{color:var(--fg)}
.chip.on{color:#fff;border-color:transparent;background:var(--primary)}
.chip b{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700;background:var(--muted);color:var(--muted-fg)}
.chip.on b{background:rgba(255,255,255,.2);color:#fff}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid}
.badge i{width:6px;height:6px;border-radius:999px;display:block}
.st-consegnato{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.st-consegnato i{background:#10b981}
.st-spedito{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.st-spedito i{background:#3b82f6}
.st-in_lavorazione{background:#fffbeb;color:#b45309;border-color:#fde68a}
.st-in_lavorazione i{background:#fbbf24}
.st-annullato{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.st-annullato i{background:#ef4444}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600}
.p-attivo{background:#ecfdf5;color:#047857}
.p-esaurito{background:#fef2f2;color:#dc2626}
.p-bozza{background:#f3f4f6;color:#6b7280}
.p-root{background:rgba(127,29,29,.1);color:var(--root)}
.p-oscurato{background:#ede9fe;color:#5b21b6}
.dt tr.oscurato td{color:var(--muted-fg)}
.dt tr.oscurato .thumb img{filter:grayscale(.9);opacity:.55}
.dt tr.oscurato b{font-weight:600;text-decoration:line-through;text-decoration-color:rgba(91,33,182,.4)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 0;text-align:center;gap:12px;color:var(--muted-fg)}
.empty p{font-size:14px;font-weight:500}

/* ── panoramica ──────────────────────────────────────── */
.hello h2{font-size:20px;font-weight:600}
.hello p{font-size:14px;color:var(--muted-fg);margin-top:2px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}
.stat .lbl{font-size:11px;font-weight:500;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.09em}
.stat .val{font-size:24px;font-weight:600}
.stat .sub{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#059669}
.ord-mini{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border-soft);transition:.15s}
.ord-mini:last-child{border-bottom:none}
.ord-mini:hover{background:rgba(0,0,0,.02)}
.thumb{border-radius:var(--r-sm);overflow:hidden;flex:none;background:var(--muted);display:block}
.thumb img{width:100%;height:100%;object-fit:cover}
.iconbtn{padding:6px;border-radius:10px;color:var(--muted-fg);transition:.15s}
.iconbtn:hover{background:var(--muted);color:var(--fg)}
.quick{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;box-shadow:var(--shadow-sm);transition:.15s}
.quick:hover{box-shadow:var(--shadow-md)}
.quick:active{transform:scale(.98)}
.quick-ic{width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;transition:.15s;flex:none}
.quick:hover .quick-ic{transform:scale(1.1)}
.quick span{font-size:14px;font-weight:500;line-height:1.25}

/* ── tabelle e righe ─────────────────────────────────── */
.ministat{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.ministat span{font-size:12px;color:var(--muted-fg)}
.ministat b{font-size:16px;font-weight:700}
.dt{width:100%;border-collapse:collapse;min-width:560px}
.dt th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-fg);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
.dt td{padding:12px 16px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle}
.dt tbody tr:last-child td{border-bottom:none}
.dt tbody tr:hover{background:rgba(0,0,0,.02)}
.prow{background:#fff;border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;gap:16px;padding:16px;transition:.15s}
.prow:hover{box-shadow:var(--shadow-md)}
.low{color:#d97706}.zero{color:#ef4444}
.codechip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.04em;background:var(--muted);padding:7px 12px;border-radius:8px;font-size:13px;color:var(--primary);flex:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.savebar{display:flex;align-items:center;gap:10px;background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;border-radius:var(--r-sm);padding:12px 16px;font-size:13px;font-weight:500}
.lockrow{display:flex;align-items:center;gap:14px;background:rgba(240,235,227,.7);border:1px dashed var(--border);border-radius:var(--r);padding:16px 20px}
.lockrow .ico{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--muted-fg);display:flex;align-items:center;justify-content:center;flex:none}
.note{padding:8px 12px;background:#fffbeb;border:1px solid #fef3c7;border-radius:var(--r-sm);font-size:12px;color:#b45309;font-weight:500}
.infobox{display:flex;gap:10px;background:rgba(240,235,227,.6);border-radius:var(--r-sm);padding:12px 16px;font-size:12px;color:var(--muted-fg);line-height:1.5}
.readonly{display:flex;align-items:center;gap:10px;background:rgba(240,235,227,.7);border-radius:var(--r);padding:12px 16px;font-size:12px;color:var(--muted-fg)}
.stars{display:inline-flex;gap:2px;align-items:center}
.avatar{width:36px;height:36px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.review{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.dl{display:grid;grid-template-columns:190px 1fr;gap:4px 20px;font-size:13px}
.dl dt{color:var(--muted-fg);font-size:12px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.dl dd{font-weight:500;padding:9px 0;border-bottom:1px solid var(--border-soft);word-break:break-word}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:none}
.switch{width:42px;height:24px;border-radius:999px;background:#d6d0c6;position:relative;flex:none;transition:.18s}
.switch.on{background:var(--primary)}
.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:#fff;box-shadow:var(--shadow-sm);transition:.18s;display:block}
.switch.on i{left:21px}

/* ── grafici ─────────────────────────────────────────── */
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px;display:flex;gap:16px;align-items:flex-start}
.kpi-ic{width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex:none}
.kpi p.l{font-size:12px;color:var(--muted-fg)}
.kpi p.v{font-size:20px;font-weight:700;margin-top:2px}
.kpi p.s{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:#059669;margin-top:4px}
.periods{display:flex;background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;flex-wrap:wrap}
.periods button{padding:8px 14px;font-size:12px;font-weight:500;color:var(--muted-fg);transition:.15s}
.periods button.on{background:var(--primary);color:#fff}
.chartbox{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px}
.chartbox h3{font-size:14px;font-weight:600}
.chartbox .csub{font-size:12px;color:var(--muted-fg);margin-top:2px}
.legend{display:flex;flex-direction:column;gap:8px;flex:1}
.legend div{display:flex;align-items:center;justify-content:space-between;gap:8px}
.legend i{width:10px;height:10px;border-radius:999px;display:block;flex:none}
svg .gridline{stroke:#f0ebe3;stroke-dasharray:3 3}
svg .axis{font-size:11px;fill:#7a7060}

/* ── modali ──────────────────────────────────────────── */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
.modal{position:relative;width:100%;max-width:520px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:92vh}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border)}
.modal-h h2{font-size:16px;font-weight:600}
.modal-b{overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.modal-f{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:12px}
.modal-f .btn{flex:1}
.confirm{position:relative;background:#fff;border-radius:var(--r);box-shadow:var(--shadow-lg);padding:24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px}
.confirm .ico{width:48px;height:48px;border-radius:var(--r);background:#fef2f2;color:#ef4444;display:flex;align-items:center;justify-content:center;flex:none}

/* ══════════════════════════════════════════════════════
   ADMIN super/owner — componenti esclusivi
   ══════════════════════════════════════════════════════ */
.rootbar{display:flex;align-items:center;gap:14px;padding:14px 20px;border-radius:var(--r);
  border:1px solid rgba(127,29,29,.22);background:linear-gradient(135deg,rgba(127,29,29,.06),rgba(201,168,124,.08))}
.rootbar .ico{width:38px;height:38px;border-radius:11px;background:rgba(127,29,29,.12);color:var(--root);display:flex;align-items:center;justify-content:center;flex:none}
.rootbar h4{font-size:13px;font-weight:600}
.rootbar p{font-size:12px;color:var(--muted-fg);margin-top:2px;line-height:1.5}

/* matrice RBAC */
.mxwrap{overflow-x:auto}
.mx{width:100%;border-collapse:collapse;min-width:860px}
.mx th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-fg);font-weight:700;padding:12px 8px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
.mx th.lbl{text-align:left;padding-left:20px;min-width:300px}
.mx th span{display:block;font-size:9px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted-fg);opacity:.75;margin-top:2px}
.mx td{padding:11px 8px;border-bottom:1px solid var(--border-soft);text-align:center;font-size:13px}
.mx td.lbl{text-align:left;padding-left:20px}
.mx td.lbl b{font-weight:600;font-size:13px}
.mx td.lbl p{font-size:11px;color:var(--muted-fg);margin-top:1px}
.mx tbody tr:hover{background:rgba(0,0,0,.02)}
.mx tr.grp td{background:rgba(240,235,227,.75);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-fg);padding:9px 20px;text-align:left}
.d-full{width:12px;height:12px;border-radius:999px;background:var(--primary);display:inline-block}
.d-part{width:12px;height:12px;border-radius:999px;display:inline-block;border:1.5px solid var(--accent);
  background:linear-gradient(90deg,var(--accent) 0 50%,transparent 50% 100%)}
.d-none{width:5px;height:5px;border-radius:999px;background:#d6d0c6;display:inline-block}
.mxlegend{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted-fg);align-items:center}
.mxlegend span{display:inline-flex;align-items:center;gap:7px}

/* ruoli */
.rolecard{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-sm)}
.rolecard .rt{display:flex;align-items:center;gap:9px}
.rolecard .rdot{width:10px;height:10px;border-radius:999px;flex:none}
.rolecard b{font-size:13px;font-weight:600}
.rolecard p{font-size:11px;color:var(--muted-fg);line-height:1.45}
.rolecard .n{font-size:18px;font-weight:700}

/* integrazioni / chiavi API */
.intg{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border-soft)}
.intg:last-child{border-bottom:none}
.intg .ii{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.intg h4{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.intg p{font-size:12px;color:var(--muted-fg);margin-top:2px}
.keyline{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px dashed rgba(0,0,0,.16);border-radius:var(--r-sm);background:rgba(240,235,227,.5);margin-top:8px}
.keyline code{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.03em;word-break:break-all}

/* log & audit */
.logline{display:flex;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border-soft);align-items:flex-start}
.logline:last-child{border-bottom:none}
.logline:hover{background:rgba(0,0,0,.02)}
.logline .lts{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted-fg);white-space:nowrap;flex:none;padding-top:2px;min-width:104px}
.logline .lic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.logline h4{font-size:13px;font-weight:600}
.logline p{font-size:12px;color:var(--muted-fg);margin-top:2px;line-height:1.45}
.sev-info{background:rgba(0,95,115,.1);color:var(--primary)}
.sev-warn{background:#fffbeb;color:#b45309}
.sev-crit{background:#fef2f2;color:#dc2626}

/* feature flag */
.flagrow{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.flagrow:last-child{border-bottom:none}
.flagrow h4{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flagrow .fkey{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted-fg)}
.flagrow p{font-size:12px;color:var(--muted-fg);margin-top:3px;line-height:1.45}
.rollout{width:150px;flex:none}
.rollout .rtrack{height:6px;border-radius:999px;background:var(--muted);overflow:hidden;margin-top:6px}
.rollout .rfill{height:100%;border-radius:999px;background:var(--primary);display:block}
.rollout .rlbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted-fg)}
.stepbtns{display:flex;gap:4px;flex:none}
.stepbtns button{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--muted-fg);transition:.15s}
.stepbtns button:hover:not(:disabled){background:var(--muted);color:var(--fg)}
.stepbtns button:disabled{opacity:.35;cursor:not-allowed}

/* zona pericolosa */
.danger{border:1px solid #fecaca;border-radius:var(--r);background:linear-gradient(135deg,rgba(239,68,68,.04),rgba(239,68,68,.01))}
.danger .card-h{border-bottom:1px solid #fecaca}
.danger .card-h h3{color:#b91c1c}
.dngrow{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(239,68,68,.14);flex-wrap:wrap}
.dngrow:last-child{border-bottom:none}
.dngrow h4{font-size:13px;font-weight:600}
.dngrow p{font-size:12px;color:var(--muted-fg);margin-top:2px;line-height:1.45;max-width:560px}

/* ── mobile ──────────────────────────────────────────── */
.mobnav,.mobsheet{display:none}
@media (max-width:900px){
  .grid4,.grid5{grid-template-columns:repeat(2,1fr)}
  .grid-2col{grid-template-columns:1fr}
}
@media (max-width:768px){
  .sidebar{display:none}
  .content{padding:16px 16px 88px}

  .mob-logo{display:block;flex:1}
  .mob-logo .logo{color:var(--sidebar-bg);font-size:13px}

  .rs-txt{display:none}

  .mobsheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}

  .sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
  .sheet-h p{color:#fff;font-size:14px;font-weight:600}
  .sheet-h span{color:rgba(255,255,255,.4);font-size:10px}

  .modal{max-width:none;border-radius:24px 24px 0 0;max-height:94vh}
  .overlay{align-items:flex-end;padding:0}
  .confirm{max-width:none;border-radius:24px 24px 0 0}
}
@media (max-width:520px){
  .grid4,.grid5{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function niceMax(v,ticks){
  ticks=ticks||4;
  if(v<=0) return ticks;
  const raw=v/ticks, p=Math.pow(10,Math.floor(Math.log10(raw)));
  const steps=[1,1.5,2,2.5,3,4,5,6,8,10];
  let step=p*10;
  for(let i=0;i<steps.length;i++){ if(p*steps[i]>=raw){step=p*steps[i];break;} }
  return step*ticks;
}
function kLabel(v){
  if(v===0) return "€0";
  const k=v/1000;
  return "€"+(Number.isInteger(k)?k:String(k).replace(".",","))+"k";
}
function areaChart(data){
  const WD=720,H=212,L=54,R=8,T=14,B=38;
  const max=niceMax(Math.max.apply(null,data.map(d=>d.fatturato))), n=data.length;
  const px=i=> n===1 ? (L+(WD-L-R)/2) : L + i*(WD-L-R)/(n-1);
  const py=v=> T + (1-v/max)*(H-T-B);
  const pts=data.map((d,i)=>[px(i),py(d.fatturato)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+" L"+pts[pts.length-1][0].toFixed(1)+" "+(H-B)+" L"+pts[0][0].toFixed(1)+" "+(H-B)+" Z";
  let g="",yl="";
  for(let i=0;i<=4;i++){
    const v=max*i/4, y=py(v);
    g+='<line class="gridline" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(WD-R)+'" y2="'+y.toFixed(1)+'"/>';
    yl+='<text class="axis" x="'+(L-10)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+kLabel(v)+'</text>';
  }
  return '<svg viewBox="0 0 '+WD+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Andamento GMV mensile">'+
    '<defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="5%" stop-color="'+TEAL+'" stop-opacity=".18"/><stop offset="95%" stop-color="'+TEAL+'" stop-opacity="0"/></linearGradient></defs>'+
    g+yl+
    '<path d="'+area+'" fill="url(#gf)"/>'+
    '<path d="'+line+'" fill="none" stroke="'+TEAL+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    data.map((d,i)=>'<g><circle cx="'+px(i).toFixed(1)+'" cy="'+py(d.fatturato).toFixed(1)+'" r="4" fill="'+TEAL+'"/>'+
      '<circle cx="'+px(i).toFixed(1)+'" cy="'+py(d.fatturato).toFixed(1)+'" r="14" fill="transparent"><title>'+d.month+': '+eurK(d.fatturato)+' · '+d.ordini+' ordini</title></circle></g>').join("")+
    data.map((d,i)=>'<text class="axis" x="'+px(i).toFixed(1)+'" y="'+(H-14)+'" text-anchor="middle">'+d.month+'</text>').join("")+
  '</svg>';
}
function donut(data){
  const size=140,c=size/2,ro=60,ri=38,gap=.05;
  const tot=data.reduce((s,d)=>s+d.value,0);
  let a=-Math.PI/2, out="";
  data.forEach(d=>{
    const sweep=(d.value/tot)*Math.PI*2, s=a+gap/2, e=a+sweep-gap/2;
    const large=(e-s)>Math.PI?1:0;
    const p=(r,ang)=>[(c+r*Math.cos(ang)).toFixed(2),(c+r*Math.sin(ang)).toFixed(2)];
    const a1=p(ro,s),a2=p(ro,e),a3=p(ri,e),a4=p(ri,s);
    out+='<path d="M'+a1[0]+' '+a1[1]+' A'+ro+' '+ro+' 0 '+large+' 1 '+a2[0]+' '+a2[1]+' L'+a3[0]+' '+a3[1]+' A'+ri+' '+ri+' 0 '+large+' 0 '+a4[0]+' '+a4[1]+' Z" fill="'+d.color+'">'+
      '<title>'+d.name+': '+d.value+' ordini</title></path>';
    a+=sweep;
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" width="140" height="140" role="img" aria-label="Distribuzione ordini per stato">'+out+
    '<text x="'+c+'" y="'+(c-2)+'" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#1a1a1a">'+tot+'</text>'+
    '<text x="'+c+'" y="'+(c+13)+'" text-anchor="middle" style="font-size:9px;fill:#7a7060">ordini</text></svg>';
}
function barsV(data){
  const WD=720,H=170,L=44,R=8,T=10,B=32;
  const max=niceMax(Math.max.apply(null,data.map(d=>d.visite)));
  const step=(WD-L-R)/data.length, bw=30;
  let g="";
  for(let i=0;i<=4;i++){
    const v=max*i/4, y=T+(1-i/4)*(H-T-B);
    g+='<line class="gridline" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(WD-R)+'" y2="'+y.toFixed(1)+'"/>'+
       '<text class="axis" x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+Math.round(v)+'</text>';
  }
  return '<svg viewBox="0 0 '+WD+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Visite settimanali">'+g+
    data.map((d,i)=>{
      const x=L+i*step+step/2-bw/2, h=(d.visite/max)*(H-T-B), y=H-B-h;
      return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" rx="6" fill="'+GOLD+'">'+
        '<title>'+d.day+': '+d.visite+' visite</title></rect>'+
        '<text class="axis" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+d.day+'</text>';
    }).join("")+'</svg>';
}
function barsH2(data,unit){
  const WD=520,H=200,L=140,R=16,T=6,B=26;
  const max=niceMax(Math.max.apply(null,data.map(d=>d.val)));
  const rowH=(H-T-B)/data.length, bh=15;
  let g="";
  for(let i=0;i<=4;i++){
    const x=L+(WD-L-R)*i/4;
    g+='<line class="gridline" x1="'+x.toFixed(1)+'" y1="'+T+'" x2="'+x.toFixed(1)+'" y2="'+(H-B)+'"/>'+
       '<text class="axis" x="'+x.toFixed(1)+'" y="'+(H-B+16)+'" text-anchor="middle" style="font-size:10px">'+Math.round(max*i/4)+'</text>';
  }
  return '<svg viewBox="0 0 '+WD+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Classifica cantine">'+g+
    data.map((d,i)=>{
      const y=T+i*rowH+(rowH-bh)/2, w=(d.val/max)*(WD-L-R);
      return '<text class="axis" x="'+(L-8)+'" y="'+(y+bh/2+3.5).toFixed(1)+'" text-anchor="end" style="font-size:10px">'+esc(d.name)+'</text>'+
        '<rect x="'+L+'" y="'+y.toFixed(1)+'" width="'+Math.max(w,2).toFixed(1)+'" height="'+bh+'" rx="6" fill="'+TEAL+'">'+
        '<title>'+esc(d.name)+': '+d.val+' '+unit+'</title></rect>';
    }).join("")+'</svg>';
}

      (vRev?alertRow("store","#d97706",vRev+" cantina/e in <b>revisione</b> da attivare","vendor",true):"")+

      (outStock?alertRow("box","#d97706",outStock+" prodotti <b>esauriti</b> nel catalogo","catalogo"):"")+

      (alertN===0?'<div class="empty" style="padding:32px 0">'+ic("checkCircle",32,"opacity:.4")+'<p>Nessun alert. Tutto sotto controllo.</p></div>':"")+
    '</div>'+

    '<div><p class="eyebrow" style="margin-bottom:12px">Impostazioni sistema · riservate a te</p><div class="grid4">'+
      quick("shield",ROOT,"Ruoli & permessi","rbac")+

      quick("clipboard",TEAL,"Log & audit","audit")+

      quick("chart",GOLD,"Report & Analytics","report")+

}

<script>
/* ═══ CATALOGO ══════════════════════════════════════════════ */
function viewCatalogo(){

      '<td>'+esc(p.vendor)+'</td><td>'+esc(p.type)+'</td><td>'+eur(p.price)+'</td>'+
      '<td class="'+(p.stock===0?"zero":p.stock<10?"low":"")+'">'+p.stock+'</td><td>'+pill(CAT_STATUS[p.status])+'</td>'+
      '<td><div class="row" style="gap:4px;justify-content:flex-end">'+
        '<button class="iconbtn" data-act="cat-hide" data-id="'+p.id+'" title="'+(osc?"Rimetti in vendita sullo shop":"Oscura: resta in catalogo ma sparisce dallo shop")+'">'+
          ic(osc?"eye":"eyeoff",15)+'</button>'+
        '<button class="iconbtn" data-act="cat-edit" data-id="'+p.id+'" title="Modifica prodotto">'+ic("pencil",15)+'</button>'+
        '<button class="iconbtn" data-act="cat-del" data-id="'+p.id+'" title="Elimina dal catalogo">'+ic("trash",15)+'</button>'+
      '</div></td></tr>';
  };

    toastBar()+
    rootBar("Controllo totale sul catalogo",
      "Sei l’unico a poter intervenire sui prodotti di qualsiasi cantina: <b>oscurare</b> un vino lo nasconde dallo shop lasciandolo nel catalogo del vendor, "+
      "<b>modificare</b> corregge dati e prezzo, <b>eliminare</b> lo rimuove del tutto. Ogni intervento è tracciato in Log &amp; audit e notificato alla cantina.")+
    '<div class="grid4">'+
      '<div class="ministat"><span>Prodotti totali</span><b>'+C.length+'</b></div>'+
      '<div class="ministat"><span>Cantine in catalogo</span><b>'+new Set(C.map(p=>p.vendor)).size+'</b></div>'+
      '<div class="ministat"><span>Oscurati</span><b>'+oscurati+'</b></div>'+
      '<div class="ministat"><span>Esauriti</span><b class="zero">'+C.filter(p=>p.status==="esaurito").length+'</b></div>'+
    '</div>'+
    (oscurati>0?'<div class="infobox">'+ic("eyeoff",15)+'<span><b>'+oscurati+' '+(oscurati===1?"prodotto oscurato":"prodotti oscurati")+'.</b> '+
      'Non compaiono sullo shop e non sono acquistabili, ma restano nel catalogo della cantina con giacenza, storico e recensioni. '+
      'La cantina li vede come “oscurati dalla piattaforma” e non può rimetterli online da sola.</span></div>':'')+
    '<div class="toolbar"><div class="search">'+ic("search",16)+'<input class="input" data-input="cat-q" data-focus-key="catq" placeholder="Cerca prodotto o cantina…" value="'+esc(S.cat.q)+'"></div>'+
      '<div class="chiprow">'+types.map(t=>'<button class="chip '+(tp===t?"on":"")+'" data-act="cat-type" data-id="'+t+'">'+(t==="all"?"Tutti":t)+'</button>').join("")+'</div></div>'+
    '<div class="card" style="overflow-x:auto"><table class="dt"><thead><tr><th>Prodotto</th><th>Cantina</th><th>Tipo</th><th>Prezzo</th><th>Giacenza</th><th>Stato</th><th style="text-align:right">Azioni</th></tr></thead><tbody>'+
      (list.length?list.map(riga).join("")
        :'<tr><td colspan="7"><div class="empty" style="padding:40px 0">'+ic("box",32,"opacity:.4")+'<p>Nessun prodotto trovato</p></div></td></tr>')+

    '<div class="grid2">'+taxCard("Categorie",TAXONOMY.categorie)+taxCard("Uvaggi",TAXONOMY.uvaggi)+'</div>'+

    '<div class="modal">'+
      '<div class="modal-h"><h2>Modifica prodotto</h2>'+
        '<button class="iconbtn" data-act="cat-edit-close" aria-label="Chiudi">'+ic("x",20)+'</button></div>'+
      '<div class="modal-b">'+
        '<div class="row" style="gap:12px"><span class="thumb" style="width:44px;height:56px"><img src="'+p.img+'" alt=""></span>'+
          '<div><p style="font-size:14px;font-weight:600">'+esc(p.name)+'</p>'+
          '<p style="font-size:12px;color:var(--muted-fg)">'+esc(p.vendor)+' · '+esc(p.id)+'</p></div></div>'+
        '<div class="field"><label class="eyebrow">Nome prodotto *</label>'+
          '<input class="input" data-input="cat-name" data-focus-key="catname" value="'+esc(f.name)+'"></div>'+
        '<div class="grid2">'+
          '<div class="field"><label class="eyebrow">Cantina</label><select class="input" data-input="cat-vendor" data-focus-key="catvendor">'+

              '<option '+(f.vendor===v?"selected":"")+'>'+esc(v)+'</option>').join("")+'</select></div>'+
          '<div class="field"><label class="eyebrow">Tipologia</label><select class="input" data-input="cat-type-form" data-focus-key="cattype">'+
            Array.from(new Set(CAT_TYPES.concat(S.catalog.map(x=>x.type)))).map(t=>
              '<option '+(f.type===t?"selected":"")+'>'+esc(t)+'</option>').join("")+'</select></div>'+
        '</div>'+
        '<div class="grid2">'+
          '<div class="field"><label class="eyebrow">Prezzo (€) *</label>'+
            '<input class="input" type="number" min="0" step="0.5" data-input="cat-price" data-focus-key="catprice" value="'+esc(f.price)+'"></div>'+
          '<div class="field"><label class="eyebrow">Giacenza (bt.) *</label>'+
            '<input class="input" type="number" min="0" data-input="cat-stock" data-focus-key="catstock" value="'+esc(f.stock)+'"></div>'+
        '</div>'+
        '<div class="field"><label class="eyebrow">Stato sullo shop</label>'+
          '<div class="row" style="gap:6px">'+stati.map(s=>'<button class="chip '+(f.status===s[0]?"on":"")+'"'+
            (f.status===s[0]&&s[0]==="oscurato"?' style="background:#5b21b6"':'')+
            ' data-act="cat-form-status" data-id="'+s[0]+'">'+(s[0]==="oscurato"?ic("eyeoff",12)+" ":"")+s[1]+'</button>').join("")+'</div>'+
          '<p style="font-size:11px;color:var(--muted-fg);margin-top:8px;line-height:1.5">'+
          'Con giacenza a 0 il prodotto passa automaticamente a <b>esaurito</b>. '+
          'Un prodotto <b>oscurato</b> resta nel catalogo della cantina ma non è visibile né acquistabile sullo shop.</p></div>'+
        '<div class="infobox">'+ic("clipboard",15)+'<span>La modifica di un prodotto altrui viene registrata in Log &amp; audit e la cantina riceve una notifica con i campi cambiati.</span></div>'+
      '</div>'+
      '<div class="modal-f"><button class="btn btn-ghost" data-act="cat-edit-close">Annulla</button>'+
        '<button class="btn btn-root" data-act="cat-save" data-id="'+p.id+'"'+(valid?"":" disabled")+'>'+ic("check",15)+' Salva modifiche</button></div>'+
    '</div></div>';

/* ═══ VENDOR / CANTINE — commissioni e attivazione sbloccate ═ */
function viewVendor(){
  const q=S.ven.q.toLowerCase(), st=S.ven.status;
  const list=S.vendors.filter(v=>(st==="all"||v.status===st)&&(!q||v.name.toLowerCase().includes(q)||v.region.toLowerCase().includes(q)));
  const chips=[["all","Tutte"],["attiva","Attive"],["in_review","In revisione"],["sospesa","Sospese"]];
  const rows=list.map(v=>{
    let actions="";
    if(v.status==="attiva") actions='<button class="btn btn-ghost" style="padding:8px 12px" data-act="ven-toggle" data-id="'+v.id+'">'+ic("ban",14)+' Sospendi</button>';
    else if(v.status==="sospesa") actions='<button class="btn btn-ghost" style="padding:8px 12px" data-act="ven-toggle" data-id="'+v.id+'">'+ic("refresh",14)+' Riattiva</button>';
    else actions='<button class="btn btn-root" style="padding:8px 12px" data-act="ven-activate" data-id="'+v.id+'">'+ic("check",14)+' Attiva cantina</button>';
    return '<div class="prow" style="flex-wrap:wrap">'+
      '<span class="thumb" style="width:44px;height:44px;border-radius:12px"><img src="'+v.img+'" alt="" loading="lazy"></span>'+
      '<div style="flex:1;min-width:150px"><div class="row" style="gap:8px;flex-wrap:wrap"><b style="font-weight:600">'+esc(v.name)+'</b>'+
        pill(VENDOR_STATUS[v.status])+pill(CONTRATTO_CFG[v.contratto])+'</div>'+
        '<p style="font-size:12px;color:var(--muted-fg)">'+esc(v.city)+", "+esc(v.region)+' · '+esc(v.owner)+' · dal '+v.joined+'</p></div>'+
      '<div style="text-align:right"><p style="font-size:10px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.08em">GMV</p><b>'+eurK(v.gmv)+'</b></div>'+
      '<div style="text-align:right"><p style="font-size:10px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.08em">Prodotti</p><b>'+v.products+'</b></div>'+
      '<div style="text-align:right"><p style="font-size:10px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.08em">Rating</p><b>'+stars(Math.round(v.rating))+'</b></div>'+
      '<div style="text-align:right"><p style="font-size:10px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.08em">Commissione</p>'+
        '<button class="btn btn-ghost" style="padding:6px 10px;font-size:13px;font-weight:700" data-act="ven-comm" data-id="'+v.id+'">'+v.commission+'% '+ic("pencil",12)+'</button></div>'+
      '<div class="row" style="gap:6px;flex:none">'+actions+
        '<button class="btn btn-ghost" style="padding:8px 12px" data-act="toast" data-msg="Messaggio inviato a '+esc(v.name)+'">'+ic("msg",14)+' Contatta</button></div>'+
    '</div>';
  }).join("");
  return '<div class="wrap-lg stack">'+
    toastBar()+
    rootBar("Commissioni e attivazione cantine sbloccate",
      "Come Admin puoi fissare la percentuale di commissione di ogni cantina e attivare quelle in revisione. Il Manager Admin gestisce e supporta le cantine, ma non tocca questi due comandi.")+
    '<div class="toolbar"><div class="search">'+ic("search",16)+'<input class="input" data-input="ven-q" data-focus-key="venq" placeholder="Cerca cantina o regione…" value="'+esc(S.ven.q)+'"></div>'+

  '</div>';

function commModal(){
  const v=S.vendors.find(x=>x.id===S.ven.comm); if(!v) return "";
  return '<div class="overlay"><div class="scrim" data-act="ven-comm-close"></div>'+
    '<div class="modal" style="max-width:460px">'+
      '<div class="modal-h"><h2>Commissione marketplace</h2>'+
        '<button class="iconbtn" data-act="ven-comm-close" aria-label="Chiudi">'+ic("x",20)+'</button></div>'+
      '<div class="modal-b">'+
        '<div class="row" style="gap:12px"><span class="thumb" style="width:44px;height:44px;border-radius:12px"><img src="'+v.img+'" alt=""></span>'+
          '<div><p style="font-size:14px;font-weight:600">'+esc(v.name)+'</p>'+
          '<p style="font-size:12px;color:var(--muted-fg)">'+esc(v.owner)+' · GMV '+eurK(v.gmv)+'</p></div></div>'+
        '<div class="field"><label class="eyebrow">Percentuale trattenuta su ogni ordine</label>'+
          '<div class="chiprow" style="flex-wrap:wrap;overflow:visible">'+
          COMMISSIONI_PRESET.map(p=>'<button class="chip '+(v.commission===p?"on":"")+'" data-act="ven-comm-set" data-id="'+v.id+'" data-val="'+p+'">'+p+'%</button>').join("")+
          '</div></div>'+
        '<div class="infobox">'+ic("info",15)+'<span>Con GMV '+eurK(v.gmv)+' lo scaglione standard prevede il '+
          scaglionePer(v.gmv)+'%. Una percentuale diversa vale come condizione contrattuale dedicata e viene registrata nel log &amp; audit.</span></div>'+
      '</div>'+
      '<div class="modal-f"><button class="btn btn-ghost" data-act="ven-comm-close">Chiudi</button></div>'+
    '</div></div>';
}
function scaglionePer(gmv){
  if(gmv<=50000) return 15;
  if(gmv<=150000) return 14;
  if(gmv<=300000) return 12;
  return 10;
}

/* ═══ UTENTI — cambio ruolo sbloccato ═══════════════════════ */
/* iscrizione alla newsletter: la dà il consenso dell’utente, qui è di sola lettura */

  const q=S.usr.q.toLowerCase(), rl=S.usr.role;

    '<div class="grid5">'+
      '<div class="ministat"><span>Clienti B2C</span><b>'+per("user")+'</b></div>'+
      '<div class="ministat"><span>Clienti Horeca</span><b>'+per("horeca")+'</b></div>'+
      '<div class="ministat"><span>Staff cantine</span><b>'+(per("vowner")+per("vmanager"))+'</b></div>'+
      '<div class="ministat"><span>Iscritti newsletter</span><b>'+S.users.filter(u=>u.newsletter).length+'</b></div>'+
      '<div class="ministat"><span>Sospesi</span><b class="zero">'+S.users.filter(u=>u.status==="sospeso").length+'</b></div>'+
    '</div>'+
    '<div class="toolbar"><div class="search">'+ic("search",16)+'<input class="input" data-input="usr-q" data-focus-key="usrq" placeholder="Cerca nome o email…" value="'+esc(S.usr.q)+'"></div>'+
      '<div class="chiprow">'+chips.map(c=>'<button class="chip '+(rl===c[0]?"on":"")+'" data-act="usr-role-filter" data-id="'+c[0]+'">'+c[1]+'</button>').join("")+'</div></div>'+
    '<div class="card" style="overflow-x:auto"><table class="dt"><thead><tr><th>Utente</th><th>Ruolo</th><th>Newsletter</th><th>Ordini</th><th>Speso</th><th>Stato</th><th style="text-align:right">Azioni</th></tr></thead><tbody>'+
      (list.length?rows:'<tr><td colspan="7"><div class="empty" style="padding:40px 0">'+ic("users",32,"opacity:.4")+'<p>Nessun utente trovato</p></div></td></tr>')+

    '<div class="modal">'+

        '<button class="iconbtn" data-act="usr-role-close" aria-label="Chiudi">'+ic("x",20)+'</button></div>'+
      '<div class="modal-b">'+

/* ═══ ORDINI — rimborsi senza soglia + cancellazione ════════ */
function viewOrdini(){
  const q=S.ord.q.toLowerCase(), st=S.ord.status;
  const list=S.orders.filter(o=>(st==="all"||o.status===st)&&(!q||o.id.toLowerCase().includes(q)||o.customer.toLowerCase().includes(q)||o.vendor.toLowerCase().includes(q)));
  const chips=[["all","Tutti"],["rimborso_richiesto","Da approvare"],["in_lavorazione","In lavorazione"],["spedito","Spediti"],["consegnato","Consegnati"],["annullato","Annullati"]];
  const cnt=k=>S.orders.filter(o=>o.status===k).length;
  const canRefund=o=>(o.status==="consegnato"||o.status==="spedito");
  const badgeCls=st2=>({rimborsato:"in_lavorazione",rimborso_richiesto:"in_lavorazione",cancellato:"annullato"}[st2]||st2);
  const pend=pendingRefunds();

  const rows=list.map(o=>{
    const badge='<span class="badge st-'+badgeCls(o.status)+'"><i></i>'+ORDER_STATUS_CFG[o.status].label+'</span>';
    let act='<span style="color:var(--muted-fg);font-size:12px">—</span>';
    if(o.status==="rimborso_richiesto"){
      act='<button class="btn btn-root" style="padding:8px 12px" data-act="ord-refund" data-id="'+o.id+'">'+ic("shield",14)+' Approva</button>';
    } else if(canRefund(o)){
      act='<div class="row" style="gap:6px;justify-content:flex-end">'+
        '<button class="btn btn-ghost" style="padding:8px 12px" data-act="ord-refund" data-id="'+o.id+'">'+ic("rotate",14)+' Rimborsa</button>'+
        '<button class="iconbtn" data-act="ord-destroy" data-id="'+o.id+'" title="Cancellazione definitiva">'+ic("trash",15)+'</button></div>';
    }
    return '<tr><td><b style="font-weight:700;color:var(--muted-fg)">'+esc(o.id)+'</b>'+
        (o.motivo?'<p style="font-size:11px;color:#b45309;margin-top:3px;max-width:280px">'+esc(o.motivo)+'</p>':"")+'</td>'+
      '<td>'+esc(o.customer)+'</td><td>'+esc(o.vendor)+'</td><td>'+o.date+'</td>'+
      '<td><b>'+eur(o.total)+'</b>'+(o.total>200?'<br><span style="font-size:10px;color:var(--root);font-weight:600">oltre soglia Manager</span>':"")+'</td>'+
      '<td>'+badge+'</td><td style="text-align:right">'+act+'</td></tr>';
  }).join("");

  return '<div class="wrap-lg stack">'+
    toastBar()+
    rootBar("Rimborsi senza limite di soglia e cancellazioni definitive",
      "Il Manager Admin rimborsa fino a 200 € e non può cancellare un ordine. Tu approvi le richieste oltre soglia, rimborsi qualsiasi importo e puoi cancellare definitivamente un ordine dal database.")+

    (pend.length?'<div class="card"><div class="card-h"><h3>In attesa della tua approvazione</h3>'+
      '<span class="pill p-root">'+pend.length+' '+(pend.length===1?"richiesta":"richieste")+'</span></div>'+
      pend.map(o=>'<div class="ord-mini">'+
        '<span class="quick-ic" style="width:34px;height:34px;background:rgba(127,29,29,.1);color:var(--root)">'+ic("clock",16)+'</span>'+
        '<div style="flex:1;min-width:0"><b style="font-size:13px;font-weight:600">'+esc(o.id)+' · '+eur(o.total)+'</b>'+
        '<p style="font-size:12px;color:var(--muted-fg)">'+esc(o.customer)+' — richiesto da '+esc(o.richiestaDa)+'</p>'+
        '<p style="font-size:12px;color:#b45309;margin-top:2px">'+esc(o.motivo)+'</p></div>'+
        '<div class="row" style="gap:6px;flex:none">'+
          '<button class="btn btn-ghost" style="padding:8px 12px" data-act="ord-reject" data-id="'+o.id+'">'+ic("ban",14)+' Nega</button>'+
          '<button class="btn btn-root" style="padding:8px 12px" data-act="ord-refund" data-id="'+o.id+'">'+ic("check",14)+' Approva</button></div>'+
      '</div>').join("")+'</div>':'')+

    '<div class="toolbar"><div class="search">'+ic("search",16)+'<input class="input" data-input="ord-q" data-focus-key="ordq" placeholder="Cerca ordine, cliente o cantina…" value="'+esc(S.ord.q)+'"></div>'+
      '<div class="chiprow">'+chips.map(c=>'<button class="chip '+(st===c[0]?"on":"")+'" data-act="ord-status" data-id="'+c[0]+'">'+c[1]+
        ((cnt(c[0])||0)>0?'<b>'+cnt(c[0])+'</b>':'')+'</button>').join("")+'</div></div>'+
    '<div class="card" style="overflow-x:auto"><table class="dt"><thead><tr><th>Ordine</th><th>Cliente</th><th>Cantina</th><th>Data</th><th>Totale</th><th>Stato</th><th style="text-align:right">Azione</th></tr></thead><tbody>'+
      (list.length?rows:'<tr><td colspan="7"><div class="empty" style="padding:40px 0">'+ic("bag",32,"opacity:.4")+'<p>Nessun ordine trovato</p></div></td></tr>')+
    '</tbody></table></div>'+
  '</div>';
}
function refundModal(){
  const o=S.orders.find(x=>x.id===S.ord.refund); if(!o) return "";
  const daApprovare=o.status==="rimborso_richiesto";
  return '<div class="overlay"><div class="scrim" data-act="ord-refund-cancel"></div>'+
    '<div class="confirm">'+
      '<div class="row" style="gap:12px"><span class="ico" style="background:rgba(127,29,29,.1);color:var(--root)">'+ic(daApprovare?"shield":"rotate",22)+'</span>'+
        '<div><h2 style="font-size:16px;font-weight:600">'+(daApprovare?"Approva il rimborso":"Conferma rimborso")+'</h2>'+
        '<p style="font-size:12px;color:var(--muted-fg)">Ordine '+esc(o.id)+' · '+esc(o.customer)+'</p></div></div>'+
      (daApprovare
        ? '<div class="note">Richiesta inviata da '+esc(o.richiestaDa)+': '+esc(o.motivo)+'</div>'

      '<p style="font-size:13px;color:var(--muted-fg);line-height:1.55">Verrà rimborsato l\'intero importo di '+
        '<b style="color:var(--fg)">'+eur(o.total)+'</b> al cliente, sullo stesso metodo di pagamento. '+
        'Come Admin non hai limiti di soglia. L\'operazione è tracciata nei Pagamenti e nel Log &amp; audit.</p>'+
      '<div class="modal-f" style="padding:0;border:none">'+

        '<button class="btn btn-root" data-act="ord-refund-confirm" data-id="'+o.id+'">Rimborsa '+eur(o.total)+'</button></div>'+

function destroyModal(){
  const o=S.orders.find(x=>x.id===S.ord.destroy); if(!o) return "";
  return '<div class="overlay"><div class="scrim" data-act="ord-destroy-cancel"></div>'+
    '<div class="confirm">'+
      '<div class="row" style="gap:12px"><span class="ico">'+ic("alert",22)+'</span>'+
        '<div><h2 style="font-size:16px;font-weight:600">Cancellazione definitiva</h2>'+
        '<p style="font-size:12px;color:var(--muted-fg)">Ordine '+esc(o.id)+' · '+eur(o.total)+'</p></div></div>'+
      '<p style="font-size:13px;color:var(--muted-fg);line-height:1.55">L\'ordine viene rimosso dagli elenchi operativi e dalle statistiche. '+
        'È un\'azione irreversibile riservata all\'Admin: usala solo per ordini creati per errore o in test. '+
        '<b style="color:var(--fg)">I documenti fiscali già emessi restano conservati per legge.</b></p>'+
      '<div class="modal-f" style="padding:0;border:none">'+
        '<button class="btn btn-ghost" data-act="ord-destroy-cancel">Annulla</button>'+
        '<button class="btn btn-danger" data-act="ord-destroy-confirm" data-id="'+o.id+'">'+ic("trash",15)+' Cancella definitivamente</button></div>'+
    '</div></div>';
}

function viewPromozioni(){
  const pr=S.promo;
  const active=S.promos.filter(c=>c.status==="attivo").length;
  const totUses=S.promos.reduce((s,c)=>s+c.uses,0);
  const desc=c=> c.type==="perc"? c.value+"% di sconto" : c.type==="fisso"? eur(c.value)+" di sconto" : "Spedizione gratuita";
  const statusPill=st=> st==="attivo"?'<span class="pill p-attivo">Attivo</span>':st==="scaduto"?'<span class="pill p-esaurito">Scaduto</span>':'<span class="pill p-bozza">Bozza</span>';
  const rows=S.promos.map(c=>'<div class="prow" style="flex-wrap:wrap">'+
    '<span class="codechip">'+esc(c.code)+'</span>'+
    '<button class="iconbtn" data-act="promo-copy" data-id="'+c.id+'" title="Copia codice">'+(pr.copied===c.id?ic("check",15,"color:#059669"):ic("copy",15))+'</button>'+
    '<div style="flex:1;min-width:130px"><p style="font-size:13px;font-weight:600">'+desc(c)+'</p>'+
      '<p style="font-size:11px;color:var(--muted-fg)">'+(c.min>0?"Spesa min. "+eur(c.min)+" · ":"")+c.uses+' utilizzi · scade '+c.expires+'</p></div>'+
    statusPill(c.status)+
    '<div class="row" style="gap:4px;flex:none">'+
      (c.status!=="scaduto"?'<button class="btn btn-ghost" style="padding:8px 12px" data-act="promo-toggle" data-id="'+c.id+'">'+(c.status==="attivo"?"Disattiva":"Attiva")+'</button>':'')+
      '<button class="iconbtn" data-act="promo-del" data-id="'+c.id+'" title="Elimina">'+ic("trash",15)+'</button>'+
    '</div></div>').join("");
  const f=pr.form||EMPTY_PROMO();
  const canCreate=f.code.trim()&&(f.type==="spedizione"||+f.value>0);
  const createCard = pr.creating
    ? '<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:16px">'+
        '<div class="spread"><span class="eyebrow">Nuovo codice globale</span>'+
          '<button class="iconbtn" data-act="promo-cancel" aria-label="Chiudi">'+ic("x",16)+'</button></div>'+
        '<div class="grid2">'+
          '<div class="field"><label class="eyebrow">Codice *</label><input class="input" data-input="promo-code" data-focus-key="promocode" placeholder="ES. AUTUNNO25" value="'+esc(f.code)+'" style="text-transform:uppercase"></div>'+
          '<div class="field"><label class="eyebrow">Tipo sconto</label><div class="row" style="gap:6px">'+
            [["perc","%"],["fisso","€"],["spedizione","Spediz."]].map(t=>'<button class="chip '+(f.type===t[0]?"on":"")+'" data-act="promo-type" data-id="'+t[0]+'">'+t[1]+'</button>').join("")+'</div></div>'+
        '</div>'+
        '<div class="grid2">'+
          (f.type!=="spedizione"
            ? '<div class="field"><label class="eyebrow">Valore *</label><input class="input" type="number" min="0" data-input="promo-value" data-focus-key="promoval" placeholder="'+(f.type==="perc"?"es. 15":"es. 10")+'" value="'+esc(f.value)+'"></div>'
            : '<div class="field"><label class="eyebrow">Valore</label><div class="input" style="background:var(--muted);color:var(--muted-fg);border-color:transparent">Spedizione gratuita</div></div>')+
          '<div class="field"><label class="eyebrow">Spesa minima (€)</label><input class="input" type="number" min="0" data-input="promo-min" data-focus-key="promomin" placeholder="0" value="'+esc(f.min)+'"></div>'+
        '</div>'+
        '<button class="btn btn-primary" data-act="promo-create" style="align-self:flex-start" '+(canCreate?"":"disabled")+'>'+ic("plus",15)+' Crea codice</button>'+
      '</div>'
    : '<button class="btn btn-primary" data-act="promo-new" style="align-self:flex-start">'+ic("plus",15)+' Nuovo codice globale</button>';
  return '<div class="wrap-lg stack">'+
    toastBar()+
    '<div class="grid3">'+
      '<div class="ministat"><span>Codici attivi</span><b>'+active+'</b></div>'+
      '<div class="ministat"><span>Utilizzi totali</span><b>'+totUses.toLocaleString("it-IT")+'</b></div>'+
      '<div class="ministat"><span>Codici totali</span><b>'+S.promos.length+'</b></div>'+
    '</div>'+
    '<div class="infobox" style="padding:14px 18px;font-size:13px;align-items:center">'+ic("ticket",15)+'&nbsp;Questi codici valgono su tutta la piattaforma. Le promozioni delle singole cantine restano gestite dai vendor.</div>'+
    createCard+
    (S.promos.length? '<div class="stack-sm" style="gap:8px">'+rows+'</div>' : '<div class="empty">'+ic("ticket",36,"opacity:.4")+'<p>Nessun codice sconto</p></div>')+
  '</div>';
}

/* ═══ LOG & AUDIT ═══════════════════════════════════════════ */
function viewAudit(){

  return '<div class="wrap-lg stack">'+
    toastBar()+
    rootBar("Log &amp; audit del back-office",
      "Ogni azione amministrativa è tracciata con autore, ruolo, oggetto, data e indirizzo IP. Il registro è in sola lettura: non è modificabile né cancellabile, nemmeno dall'Admin.")+

    '<div class="grid3">'+
      '<div class="ministat"><span>Azioni critiche (7 gg)</span><b class="zero">'+cnt("crit")+'</b></div>'+
      '<div class="ministat"><span>Da verificare</span><b class="low">'+cnt("warn")+'</b></div>'+

      '<input class="input" data-input="audit-q" data-focus-key="auditq" placeholder="Cerca autore, azione o oggetto…" value="'+esc(S.audit.q)+'"></div>'+
      '<div class="chiprow">'+chips.map(c=>'<button class="chip '+(sv===c[0]?"on":"")+'" data-act="audit-sev" data-id="'+c[0]+'">'+c[1]+
        ((cnt(c[0])||0)>0?'<b>'+cnt(c[0])+'</b>':'')+'</button>').join("")+'</div>'+
      '<button class="btn btn-ghost" data-act="toast" data-msg="Esportazione registro avviata">'+ic("download",14)+' Esporta</button></div>'+

function emptyBox(icon,t,s){

/* ═══ COMMISSIONI & CONTRATTI ═══════════════════════════════ */
function viewCommissioni(){
  const media=(S.vendors.reduce((s,v)=>s+v.commission,0)/S.vendors.length).toFixed(1).replace(".",",");
  const ricavo=S.vendors.reduce((s,v)=>s+v.gmv*v.commission/100,0);
  const daFirmare=S.vendors.filter(v=>v.contratto!=="firmato");

  return '<div class="wrap-lg stack">'+
    toastBar()+
    rootBar("Commissioni marketplace e contratti vendor",
      "La percentuale trattenuta su ogni ordine e lo stato contrattuale di ogni cantina. Il Manager Admin le vede in sola lettura: fissarle è una prerogativa esclusiva dell'Admin.")+

    '<div class="grid4">'+
      statTile("Commissione media",media+" %","","percent",GOLD)+
      statTile("Ricavo da commissioni",eurK(Math.round(ricavo)),"","euro",TEAL)+
      statTile("Cantine a contratto",S.vendors.filter(v=>v.contratto==="firmato").length+" / "+S.vendors.length,"","file",GREEN)+
      statTile("Contratti aperti",String(daFirmare.length),"","alert","#d97706")+
    '</div>'+

    '<div class="card">'+
      '<div class="card-h"><h3>Scaglioni standard</h3><span class="packnote muted" style="font-size:12px">applicati alle nuove cantine</span></div>'+
      '<div style="overflow-x:auto"><table class="dt"><thead><tr><th>GMV annuo della cantina</th><th>Commissione</th><th>Note</th></tr></thead><tbody>'+
        SCAGLIONI.map(s=>'<tr><td><b style="font-weight:600">'+(s.a?"€ "+s.da+" — € "+s.a:"€ "+s.da)+'</b></td>'+
          '<td><b style="font-size:15px;color:var(--primary)">'+s.perc+'%</b></td>'+
          '<td class="muted">'+(s.perc===10?"Condizione riservata ai partner storici":"Scaglione automatico, rivisto ogni trimestre")+'</td></tr>').join("")+
      '</tbody></table></div>'+
      '<div style="padding:16px 20px;border-top:1px solid var(--border)">'+
        '<div class="infobox">'+ic("info",15)+'<span>Una cantina può avere una percentuale fuori scaglione come condizione contrattuale dedicata: '+
        'la modifichi dalla scheda della cantina e resta tracciata nel log.</span></div></div>'+
    '</div>'+

    '<div class="card">'+
      '<div class="card-h"><h3>Contratti per cantina</h3>'+
        '<button class="btn btn-ghost" style="padding:8px 12px;font-size:12px" data-act="toast" data-msg="Esportazione contratti avviata">'+ic("download",13)+' Esporta</button></div>'+
      '<div style="overflow-x:auto"><table class="dt"><thead><tr><th>Cantina</th><th>Titolare</th><th>GMV</th><th>Commissione</th><th>Contratto</th><th>Scadenza</th><th style="text-align:right">Azioni</th></tr></thead><tbody>'+
        S.vendors.map(v=>{
          const std=scaglionePer(v.gmv);
          const fuori=v.commission!==std;
          return '<tr><td><div class="row" style="gap:10px"><span class="thumb" style="width:32px;height:32px;border-radius:9px"><img src="'+v.img+'" alt="" loading="lazy"></span>'+
            '<div><b style="font-weight:600">'+esc(v.name)+'</b><p style="font-size:11px;color:var(--muted-fg)">'+esc(v.region)+'</p></div></div></td>'+
            '<td>'+esc(v.owner)+'</td><td>'+eurK(v.gmv)+'</td>'+
            '<td><b style="font-size:14px">'+v.commission+'%</b>'+
              (fuori?'<p style="font-size:10px;color:#b45309">fuori scaglione ('+std+'%)</p>':'<p style="font-size:10px;color:var(--muted-fg)">da scaglione</p>')+'</td>'+
            '<td>'+pill(CONTRATTO_CFG[v.contratto])+'</td>'+
            '<td class="muted">'+v.scadenza+'</td>'+
            '<td style="text-align:right"><div class="row" style="gap:6px;justify-content:flex-end">'+
              '<button class="btn btn-root" style="padding:7px 12px;font-size:12px" data-act="ven-comm" data-id="'+v.id+'">'+ic("percent",13)+' Modifica</button>'+
              '<button class="iconbtn" data-act="toast" data-msg="Contratto di '+esc(v.name)+' (demo)" title="Apri contratto">'+ic("file",15)+'</button>'+
            '</div></td></tr>';
        }).join("")+
      '</tbody></table></div>'+
    '</div>'+

    (daFirmare.length
      ? '<div class="card danger"><div class="card-h"><h3>Contratti da chiudere</h3><span class="pill p-esaurito">'+daFirmare.length+'</span></div>'+
        daFirmare.map(v=>'<div class="dngrow">'+
          '<span class="quick-ic" style="width:34px;height:34px;background:#fef2f2;color:#dc2626">'+ic("file",16)+'</span>'+
          '<div style="flex:1;min-width:0"><h4>'+esc(v.name)+' — contratto '+CONTRATTO_CFG[v.contratto].label.toLowerCase()+'</h4>'+
          '<p>'+(v.contratto==="da_firmare"
            ? "La cantina non può essere attivata finché il contratto non è firmato dal titolare "+esc(v.owner)+"."
            : "Contratto in verifica: la cantina resta sospesa fino al completamento dei controlli.")+'</p></div>'+
          '<button class="btn btn-ghost" style="flex:none" data-act="nav" data-id="vendor">Apri la cantina</button></div>').join("")+
        '</div>'
      : '')+
  '</div>';
}

function header(){

    '<div class="mob-logo">'+logo()+'</div>'+

      '<span class="rs-txt"><p>'+esc(ADMIN.nome)+'</p><p>Admin super / owner</p></span>'+ic("chevD",13)+'</button>'+

        '<div class="rs-menu-h">Sicurezza</div>'+
        '<div class="rs-opt" style="cursor:default"><span class="rs-opt-ic" style="background:#047857">'+ic("smartphone",15)+'</span>'+
          '<span style="flex:1;min-width:0"><span class="rs-opt-t"><p>2FA obbligatoria</p><span style="background:#047857">attiva</span></span>'+
          '<span class="rs-opt-s">Ultimo accesso: '+esc(ADMIN.accesso)+'</span></span></div>'+
        '<button class="rs-opt" data-act="nav" data-id="audit"><span class="rs-opt-ic" style="background:var(--primary)">'+ic("clipboard",15)+'</span>'+

          '<span class="rs-opt-s">Rivedi cosa hai modificato nel back-office</span></span></button>'+
        '<button class="rs-opt" data-act="noop"><span class="rs-opt-ic" style="background:#b91c1c">'+ic("logout",15)+'</span>'+

function mobileNav(){
  const prim=ALL_NAV.filter(n=>MOBILE_NAV.indexOf(n.id)>=0);
  const overflow=ALL_NAV.filter(n=>MOBILE_NAV.indexOf(n.id)<0);
  return '<nav class="mobnav">'+

    '<button data-act="mob-open">'+ic("menu",20)+'Altro</button></nav>'+

/* ═══ ROUTER ════════════════════════════════════════════════ */
function view(){
  if(SECTIONS.indexOf(S.section)<0) S.section="panoramica";
  let body;
  switch(S.section){
    case "panoramica":   body=viewPanoramica(); break;
    case "catalogo":     body=viewCatalogo(); break;
    case "vendor":       body=viewVendor(); break;
    case "utenti":       body=viewUtenti(); break;
    case "ordini":       body=viewOrdini(); break;
    case "pagamenti":    body=viewPagamenti(); break;
    case "wineclub":     body=viewWineClub(); break;
    case "promozioni":   body=viewPromozioni(); break;
    case "spedizioni":   body=viewSpedizioni(); break;
    case "contenuti":    body=viewContenuti(); break;
    case "blog":         body=viewBlog(); break;
    case "marketing":    body=viewMarketing(); break;
    case "recensioni":   body=viewRecensioni(); break;
    case "report":       body=viewReport(); break;
    case "rbac":         body=viewRbac(); break;
    case "integrazioni": body=viewIntegrazioni(); break;
    case "audit":        body=viewAudit(); break;
    case "flags":        body=viewFlags(); break;
    case "commissioni":  body=viewCommissioni(); break;
    default:             body=viewPanoramica();
  }
  return sidebar()+

    mobileNav()+
    (S.ord.refund?refundModal():"")+
    (S.ord.destroy?destroyModal():"")+
    (S.cat.edit?catEditModal():"")+
    (S.cat.del?catDelModal():"")+
    (S.usr.roleModal?roleModal():"")+
    (S.ven.comm?commModal():"");
}

/* ── Render con conservazione del focus ─────────────────────── */
const root=document.getElementById("root");
function render(){
  const a=document.activeElement;
  const key=a&&a.dataset?a.dataset.focusKey:null;
  let pos=null; try{pos=a?a.selectionStart:null}catch(e){}
  root.innerHTML=view();
  if(key){
    const el=root.querySelector('[data-focus-key="'+key+'"]');
    if(el){el.focus(); if(pos!=null){try{el.setSelectionRange(pos,pos)}catch(e){}}}
  }
}

/* ── Eventi ─────────────────────────────────────────────────── */
root.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el){ if(S.roleMenu){S.roleMenu=false;render();} return; }
  const act=el.dataset.act, id=el.dataset.id;
  if(act!=="toast") S.toast=null;

  switch(act){
    case "nav": S.section=id; S.mobMenu=false; S.roleMenu=false; break;
    case "role-toggle": S.roleMenu=!S.roleMenu; break;
    case "mob-open": S.mobMenu=true; break;
    case "mob-close": S.mobMenu=false; break;
    case "toast": S.toast=el.dataset.msg||""; break;

    /* catalogo · oscura, modifica, elimina (solo Admin) */
    case "cat-type": S.cat.type=id; break;
    case "cat-hide": { const p=S.catalog.find(x=>x.id===id);
      if(p){
        if(p.status==="oscurato"){
          p.status = p.prevStatus || (p.stock===0?"esaurito":"attivo"); delete p.prevStatus;
          S.toast=p.name+" è di nuovo visibile sullo shop";
        }else{
          p.prevStatus=p.status; p.status="oscurato";
          S.toast=p.name+" oscurato · "+p.vendor+" riceve la notifica";
        }
      } break; }
    case "cat-edit": { const p=S.catalog.find(x=>x.id===id);
      if(p){ S.cat.edit=id;
        S.cat.form={name:p.name,vendor:p.vendor,type:p.type,price:p.price,stock:p.stock,status:p.status==="esaurito"?"attivo":p.status}; }
      break; }
    case "cat-edit-close": S.cat.edit=null; S.cat.form=null; break;
    case "cat-form-status": if(S.cat.form) S.cat.form.status=id; break;
    case "cat-save": { const p=S.catalog.find(x=>x.id===id), f=S.cat.form;
      if(p&&f){
        const prezzo=parseFloat(String(f.price).replace(",","."));
        const giac=parseInt(f.stock,10);
        if(f.name.trim()&&prezzo>0&&!isNaN(giac)&&giac>=0){
          p.name=f.name.trim(); p.vendor=f.vendor; p.type=f.type; p.price=prezzo; p.stock=giac;
          if(f.status==="oscurato"){ p.status="oscurato"; p.prevStatus=giac===0?"esaurito":"attivo"; }
          else{ p.status = giac===0 ? "esaurito" : f.status; delete p.prevStatus; }
          S.toast="Prodotto aggiornato · notifica inviata a "+p.vendor;
          S.cat.edit=null; S.cat.form=null;
        }
      } break; }
    case "cat-del": S.cat.del=id; break;
    case "cat-del-cancel": S.cat.del=null; break;
    case "cat-del-confirm": { const i=S.catalog.findIndex(x=>x.id===id);
      if(i>=0){ const p=S.catalog[i]; S.catalog.splice(i,1);
        S.toast=p.name+" eliminato dal catalogo di "+p.vendor; }
      S.cat.del=null; break; }

    /* vendor · commissioni e attivazione (solo Admin) */
    case "ven-status": S.ven.status=id; break;
    case "ven-toggle": { const v=S.vendors.find(x=>x.id===id);
      if(v){ v.status=(v.status==="attiva"?"sospesa":"attiva"); S.toast="Cantina "+v.name+(v.status==="sospesa"?" sospesa":" riattivata"); } break; }
    case "ven-activate": { const v=S.vendors.find(x=>x.id===id);
      if(v){ v.status="attiva"; v.contratto="firmato"; v.scadenza="31 lug 2029";
        S.toast="Cantina "+v.name+" attivata e contratto registrato"; } break; }
    case "ven-comm": S.ven.comm=id; break;
    case "ven-comm-close": S.ven.comm=null; break;
    case "ven-comm-set": { const v=S.vendors.find(x=>x.id===id);
      if(v){ v.commission=parseInt(el.dataset.val,10); S.toast="Commissione di "+v.name+" impostata al "+v.commission+"%"; } break; }

    /* utenti · cambio ruolo (solo Admin) */
    case "usr-role-filter": S.usr.role=id; break;
    case "usr-toggle": { const u=S.users.find(x=>x.id===id);
      if(u){ u.status=(u.status==="attivo"?"sospeso":"attivo"); S.toast="Utente "+u.name+(u.status==="sospeso"?" sospeso":" riattivato"); } break; }
    case "usr-role": S.usr.roleModal=id; S.usr.pick=null; break;
    case "usr-role-close": S.usr.roleModal=null; S.usr.pick=null; break;
    case "usr-role-pick": S.usr.pick=id; break;
    case "usr-role-save": { const u=S.users.find(x=>x.id===id);
      if(u&&S.usr.pick&&S.usr.pick!==u.role){
        const prima=roleById(u.role).label; u.role=S.usr.pick;
        S.toast="Ruolo di "+u.name+" cambiato da "+prima+" a "+roleById(u.role).label;
      }
      S.usr.roleModal=null; S.usr.pick=null; break; }

    /* ordini · rimborsi senza soglia e cancellazioni */
    case "ord-status": S.ord.status=id; break;
    case "ord-refund": S.ord.refund=id; break;
    case "ord-refund-cancel": S.ord.refund=null; break;
    case "ord-refund-confirm": { const o=S.orders.find(x=>x.id===id);
      if(o){ o.status="rimborsato"; delete o.motivo; S.toast="Rimborso di "+eur(o.total)+" emesso per "+o.id; }
      S.ord.refund=null; break; }
    case "ord-reject": { const o=S.orders.find(x=>x.id===id);
      if(o){ o.status="consegnato"; delete o.motivo; S.toast="Richiesta di rimborso negata per "+o.id; } break; }
    case "ord-destroy": S.ord.destroy=id; break;
    case "ord-destroy-cancel": S.ord.destroy=null; break;
    case "ord-destroy-confirm": { const o=S.orders.find(x=>x.id===id);
      if(o){ o.status="cancellato"; S.toast="Ordine "+o.id+" cancellato definitivamente"; }
      S.ord.destroy=null; break; }

    /* pagamenti · wine club */
    case "pay-tab": S.pay.tab=id; break;
    case "wc-tab": S.wc.tab=id; break;

    /* promozioni globali */
    case "promo-new": S.promo.creating=true; S.promo.form=EMPTY_PROMO(); break;
    case "promo-cancel": S.promo.creating=false; S.promo.form=null; break;
    case "promo-type": if(S.promo.form) S.promo.form.type=id; break;
    case "promo-create": {
      const f=S.promo.form;
      if(f&&f.code.trim()&&(f.type==="spedizione"||+f.value>0)){
        S.promos.unshift({id:"gp"+(nextId++),code:f.code.trim().toUpperCase(),type:f.type,
          value:f.type==="spedizione"?0:(+f.value),min:(+f.min||0),uses:0,expires:f.expires||"—",status:"attivo"});
        S.promo.creating=false; S.promo.form=null; S.toast="Codice sconto creato";
      }
      break;
    }
    case "promo-toggle": { const c=S.promos.find(x=>x.id===id); if(c) c.status=(c.status==="attivo"?"bozza":"attivo"); break; }
    case "promo-del": S.promos=S.promos.filter(x=>x.id!==id); break;
    case "promo-copy": { const c=S.promos.find(x=>x.id===id);
      if(c){ try{navigator.clipboard&&navigator.clipboard.writeText(c.code);}catch(err){} S.promo.copied=id; } break; }

    /* spedizioni */
    case "ship-toggle": { const c=S.carriers.find(x=>x.id===id);
      if(c){ c.enabled=!c.enabled; S.toast=c.name+(c.enabled?" abilitato":" disabilitato"); } break; }

    /* CMS */
    case "cms-tab": S.cms.tab=id; break;
    case "cms-toggle": { const h=S.cmsHome.find(x=>x.id===id); if(h) h.visible=!h.visible; break; }
    case "cms-move": {
      const dir=parseInt(el.dataset.dir,10)||0, i=S.cmsHome.findIndex(x=>x.id===id), j=i+dir;
      if(i>=0&&j>=0&&j<S.cmsHome.length){ const t=S.cmsHome[i]; S.cmsHome[i]=S.cmsHome[j]; S.cmsHome[j]=t; }
      break;
    }

    /* blog · marketing */
    case "blog-status": S.blog.status=id; break;
    case "blog-new": S.posts.unshift({id:"b"+(nextId++),title:"Nuovo articolo senza titolo",author:"Redazione Stappando",category:"News",date:"—",status:"bozza"}); S.toast="Bozza creata"; break;
    case "blog-toggle": { const p=S.posts.find(x=>x.id===id);
      if(p){ p.status=(p.status==="pubblicato"?"bozza":"pubblicato"); if(p.status==="pubblicato"&&p.date==="—") p.date="17 lug 2026"; } break; }
    case "blog-del": S.posts=S.posts.filter(x=>x.id!==id); S.toast="Articolo eliminato"; break;
    case "mkt-toggle": { const c=S.campaigns.find(x=>x.id===id); if(c) c.status=(c.status==="attiva"?"pausa":"attiva"); break; }

    /* recensioni */
    case "rev-status": S.rev.status=id; break;
    case "rev-approve": { const r=S.reviews.find(x=>x.id===id); if(r){ r.status="pubblicata"; S.toast="Recensione pubblicata"; } break; }
    case "rev-reject": { const r=S.reviews.find(x=>x.id===id); if(r){ r.status="rifiutata"; S.toast="Recensione rifiutata"; } break; }

    /* report */
    case "rep-period": S.report.period=id; break;

    /* ── SISTEMA ── */
    case "rbac-grp": S.rbac.grp=id; break;
    case "intg-toggle": { const i=S.intg.find(x=>x.id===id);
      if(i){ i.on=!i.on; if(!i.on&&S.intgShow===id) S.intgShow=null;
        S.toast=i.name+(i.on?" riattivata":" disattivata"); } break; }
    case "intg-show": S.intgShow = S.intgShow===id ? null : id; break;
    case "intg-key": { const i=S.intg.find(x=>x.id===id);
      if(i){ i.updated="oggi"; S.intgShow=null; S.toast="Chiave di "+i.name+" rigenerata — aggiorna i sistemi collegati"; } break; }
    case "audit-sev": S.audit.sev=id; break;
    case "flag-toggle": { const f=S.flags.find(x=>x.id===id);
      if(f){ f.on=!f.on; if(!f.on) f.rollout=0; else if(f.rollout===0) f.rollout=25;
        S.toast=f.name+(f.on?" attivata al "+f.rollout+"%":" spenta per tutti"); } break; }
    case "flag-step": { const f=S.flags.find(x=>x.id===id), dir=parseInt(el.dataset.dir,10)||0;
      if(f&&f.on){ f.rollout=Math.max(0,Math.min(100,f.rollout+dir*25));
        if(f.rollout===0) f.on=false;
        S.toast=f.name+": rollout al "+f.rollout+"%"; } break; }

    case "noop": break;
  }
  if(act!=="role-toggle") S.roleMenu=false;
  if(act!=="promo-copy") S.promo.copied=null;
  render();
});

root.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.input){
    const map={
      "cat-q":()=>S.cat.q=t.value,
      "cat-name":()=>{if(S.cat.form)S.cat.form.name=t.value;},
      "cat-vendor":()=>{if(S.cat.form)S.cat.form.vendor=t.value;},
      "cat-type-form":()=>{if(S.cat.form)S.cat.form.type=t.value;},
      "cat-price":()=>{if(S.cat.form)S.cat.form.price=t.value;},
      "cat-stock":()=>{if(S.cat.form)S.cat.form.stock=t.value;},
      "ven-q":()=>S.ven.q=t.value,
      "usr-q":()=>S.usr.q=t.value,
      "ord-q":()=>S.ord.q=t.value,
      "audit-q":()=>S.audit.q=t.value,
      "promo-code":()=>{if(S.promo.form)S.promo.form.code=t.value.toUpperCase();},
      "promo-value":()=>{if(S.promo.form)S.promo.form.value=t.value;},
      "promo-min":()=>{if(S.promo.form)S.promo.form.min=t.value;},
    };
    if(map[t.dataset.input]){ S.toast=null; map[t.dataset.input](); render(); }
  }
});

/* i <select> del modale catalogo: alcuni browser emettono solo “change” */
root.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.input&&t.tagName==="SELECT"){
    if(t.dataset.input==="cat-vendor"&&S.cat.form) S.cat.form.vendor=t.value;
    if(t.dataset.input==="cat-type-form"&&S.cat.form) S.cat.form.type=t.value;
    render();
  }
});

root.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(S.ord.refund||S.ord.destroy||S.usr.roleModal||S.ven.comm||S.mobMenu||S.roleMenu||S.promo.creating||S.cat.edit||S.cat.del){
      S.ord.refund=null;S.ord.destroy=null;S.usr.roleModal=null;S.usr.pick=null;S.ven.comm=null;
      S.cat.edit=null;S.cat.form=null;S.cat.del=null;
      S.mobMenu=false;S.roleMenu=false;S.promo.creating=false;S.promo.form=null;render();
    }
  }
});

render();
</script>






</body>
</html>
