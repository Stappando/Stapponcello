  <g>
    <rect x="556" y="286" width="104" height="66" rx="3" fill="#e8d3b2"/>
    <path d="M548 288 L608 258 L668 288 Z" fill="#b8714f"/>
    <rect x="574" y="312" width="16" height="22" fill="#6b5a44"/>
    <rect x="606" y="310" width="14" height="14" fill="#6b5a44"/>
    <rect x="634" y="310" width="14" height="14" fill="#6b5a44"/>
    <rect x="648" y="252" width="12" height="30" fill="#c08863"/>
