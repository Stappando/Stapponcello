  <path d="M0 402 C 180 366 320 400 470 384 C 620 368 720 392 800 380 L800 600 L0 600 Z" fill="url(#c3)"/>
  <g stroke="#334029" stroke-width="7" stroke-linecap="round" opacity=".55">
