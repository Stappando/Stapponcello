<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Le colline di Podere Cigli al tramonto, con i filari e la casa colonica">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d9a8"/><stop offset="45%" stop-color="#eebd85"/><stop offset="100%" stop-color="#e2a173"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa77a"/><stop offset="100%" stop-color="#7d8c62"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e9060"/><stop offset="100%" stop-color="#61734b"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d7048"/><stop offset="100%" stop-color="#43563a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#cielo)"/>
  <circle cx="612" cy="168" r="54" fill="#fdf0d5" opacity=".92"/>

  <!-- colline lontane -->
  <path d="M0 268 C 140 224 250 262 360 246 C 470 230 560 260 690 236 C 740 227 780 232 800 236 L800 600 L0 600 Z" fill="url(#c1)"/>
  <!-- collina di mezzo con i cipressi -->
