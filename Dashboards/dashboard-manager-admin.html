<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stappando · Dashboard Manager Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Montserrat:ital,wght@0,300..800;1,400..700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --sidebar-bg:#003d4d;
  --primary:#005f73;
  --primary-dark:#003d4d;
  --accent:#c9a87c;
  --bg:#f7f3ee;
  --card:#ffffff;
  --fg:#1a1a1a;
  --muted-fg:#7a7060;
  --muted:#f0ebe3;
  --border:rgba(0,0,0,.09);
  --border-soft:rgba(0,0,0,.06);
  --r:16px;
  --r-sm:12px;
  --r-lg:24px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.07);
  --shadow-lg:0 12px 40px rgba(0,0,0,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  background:var(--bg);color:var(--fg);
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
ul{list-style:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── shell ───────────────────────────────────────────── */
#root{display:flex;height:100vh;overflow:hidden}

.sidebar{
  width:240px;flex:none;background:var(--sidebar-bg);
  display:flex;flex-direction:column;height:100%;
}
.sb-logo{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo{color:#fff;font-weight:800;letter-spacing:.14em;font-size:15px;line-height:1}
.logo em{font-style:normal;color:var(--accent)}
.logo-sub{font-size:8px;letter-spacing:.34em;color:rgba(255,255,255,.5);margin-top:5px;font-weight:500}
.sb-cantina{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px}
.sb-avatar{width:36px;height:36px;border-radius:999px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.sb-cantina p{color:#fff;font-size:13px;font-weight:600;line-height:1.2}
.role-chip{display:inline-block;margin-top:4px;font-size:10px;font-weight:600;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.2);color:#fff}
.role-chip.staff{background:rgba(201,168,124,.22);color:#f0d9b5}

.sb-nav{flex:1;padding:16px 12px;overflow-y:auto}
.sb-label{padding:0 12px;margin-bottom:8px;color:rgba(255,255,255,.32);font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:500}
.sb-item{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);font-size:14px;color:rgba(255,255,255,.6);transition:.15s}
.sb-item:hover{color:#fff;background:rgba(255,255,255,.08)}
.sb-item.on{background:rgba(255,255,255,.15);color:#fff;font-weight:500}
.sb-item .chev{margin-left:auto;color:rgba(255,255,255,.4)}
.sb-sep{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.sb-foot{padding:16px 12px;border-top:1px solid rgba(255,255,255,.1)}
.sb-logout{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);font-size:14px;color:rgba(255,255,255,.5);transition:.15s}
.sb-logout:hover{color:#fca5a5;background:rgba(239,68,68,.1)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.header{
  height:56px;flex:none;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 24px;z-index:10;
}
.header h1{font-size:16px;font-weight:600;flex:1;min-width:0}
.mob-logo{display:none}
.roleswitch{position:relative}
.rs-btn{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card);transition:.15s}
.rs-btn:hover{background:var(--muted)}
.rs-badge{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.rs-txt p:first-child{font-size:12px;font-weight:600;line-height:1}
.rs-txt p:last-child{font-size:10px;color:var(--muted-fg);margin-top:3px;line-height:1}
.rs-menu{position:absolute;right:0;top:calc(100% + 6px);width:268px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden;z-index:40}
.rs-menu-h{padding:12px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.1em}
.rs-opt{width:100%;display:flex;gap:12px;padding:14px 16px;text-align:left;transition:.15s}
.rs-opt:hover{background:rgba(0,0,0,.03)}
.rs-opt.on{background:rgba(0,95,115,.05)}
.rs-opt-ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex:none;margin-top:2px}
.rs-opt-t{display:flex;align-items:center;gap:8px}
.rs-opt-t p{font-size:13px;font-weight:600}
.rs-opt-t span{font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px;color:#fff}
.rs-opt-s{font-size:11px;color:var(--muted-fg);margin-top:3px;line-height:1.4}
.bell{position:relative;padding:8px;border-radius:var(--r-sm);color:rgba(26,26,26,.7);transition:.15s;flex:none}
.bell:hover{background:var(--muted)}
.bell b{position:absolute;top:5px;right:5px;width:16px;height:16px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}

.content{flex:1;overflow-y:auto;padding:24px}
.wrap{max-width:1020px;margin:0 auto}
.wrap-sm{max-width:840px;margin:0 auto}
.wrap-lg{max-width:1180px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:20px}
.stack-sm{display:flex;flex-direction:column;gap:12px}

/* ── generic ─────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:14px;font-weight:600}
.link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--primary)}
.link:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r-sm);font-size:14px;font-weight:500;transition:.15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{border:1px solid var(--border);color:var(--muted-fg);background:var(--card)}
.btn-ghost:hover{background:var(--muted)}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.muted{color:var(--muted-fg)}
.eyebrow{font-size:11px;font-weight:600;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.1em}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}

.input{width:100%;padding:10px 16px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card);font-size:14px;outline:none;transition:.15s}
.input:focus{border-color:rgba(0,95,115,.4);box-shadow:0 0 0 3px rgba(0,95,115,.12)}
.search{position:relative;flex:1;min-width:190px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted-fg)}
.search input{padding-left:36px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-sm);font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--muted-fg);white-space:nowrap;flex:none;transition:.15s}
.chip:hover{color:var(--fg)}
.chip.on{color:#fff;border-color:transparent;background:var(--primary)}
.chip b{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700;background:var(--muted);color:var(--muted-fg)}
.chip.on b{background:rgba(255,255,255,.2);color:#fff}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid}
.badge i{width:6px;height:6px;border-radius:999px;display:block}
.st-consegnato{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.st-consegnato i{background:#10b981}
.st-spedito{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.st-spedito i{background:#3b82f6}
.st-in_lavorazione{background:#fffbeb;color:#b45309;border-color:#fde68a}
.st-in_lavorazione i{background:#fbbf24}
.st-annullato{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.st-annullato i{background:#ef4444}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600}
.p-attivo{background:#ecfdf5;color:#047857}
.p-esaurito{background:#fef2f2;color:#dc2626}
.p-bozza{background:#f3f4f6;color:#6b7280}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 0;text-align:center;gap:12px;color:var(--muted-fg)}
.empty p{font-size:14px;font-weight:500}

/* ── panoramica ──────────────────────────────────────── */
.hello h2{font-size:20px;font-weight:600}
.hello p{font-size:14px;color:var(--muted-fg);margin-top:2px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}
.stat .lbl{font-size:11px;font-weight:500;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.09em}
.stat .val{font-size:24px;font-weight:600}
.stat .sub{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#059669}
.dash-grid{display:grid;grid-template-columns:3fr 2fr;gap:20px}
.ord-mini{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border-soft);transition:.15s}
.ord-mini:last-child{border-bottom:none}
.ord-mini:hover{background:rgba(0,0,0,.02)}
.prod-mini{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border-soft)}
.prod-mini:hover{background:rgba(0,0,0,.02)}
.thumb{border-radius:var(--r-sm);overflow:hidden;flex:none;background:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.iconbtn{padding:6px;border-radius:10px;color:var(--muted-fg);transition:.15s}
.iconbtn:hover{background:var(--muted);color:var(--fg)}
.quick{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;box-shadow:var(--shadow-sm);transition:.15s}
.quick:hover{box-shadow:var(--shadow-md)}
.quick:active{transform:scale(.98)}
.quick-ic{width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;transition:.15s}
.quick:hover .quick-ic{transform:scale(1.1)}
.quick span{font-size:14px;font-weight:500;line-height:1.25}

/* ── ordini ──────────────────────────────────────────── */
.ord-layout{display:flex;gap:20px;height:100%}
.ord-list-col{display:flex;flex-direction:column;min-width:0;flex:1}
.ord-list-col.split{flex:0 0 360px;width:360px}
.ord-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.ord-card{width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;transition:.15s}
.ord-card:hover{box-shadow:var(--shadow-md)}
.ord-card.on{border-color:rgba(0,95,115,.4);box-shadow:0 0 0 3px rgba(0,95,115,.1)}
.ord-card .code{font-size:12px;font-weight:700;color:var(--muted-fg)}
.ord-card .cust{font-size:14px;font-weight:600;margin-top:2px}
.stackimgs{display:flex}
.stackimgs .thumb{width:32px;height:40px;border:2px solid #fff;margin-left:-8px;border-radius:8px}
.stackimgs .thumb:first-child{margin-left:0}
.ord-foot{display:flex;align-items:center;justify-content:space-between;padding-top:10px;margin-top:12px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--muted-fg)}
.ord-total{font-size:14px;font-weight:700;color:var(--primary)}
.detail-col{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.detail-scroll{overflow-y:auto;height:100%}
.detail-h{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;z-index:5}
.detail-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.dropdown{position:relative}
.dd-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--shadow-lg);overflow:hidden;z-index:20}
.dd-item{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px;text-align:left;transition:.15s}
.dd-item:hover{background:rgba(0,0,0,.03)}
.line{display:flex;gap:10px;font-size:12px;color:var(--muted-fg);align-items:flex-start}
.note{padding:8px 12px;background:#fffbeb;border:1px solid #fef3c7;border-radius:var(--r-sm);font-size:12px;color:#b45309;font-weight:500}
.oi{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border-soft)}
.oi:last-child{border-bottom:none}
.totrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted-fg)}
.totrow.big{font-size:14px;font-weight:600;color:var(--fg);padding-top:8px;border-top:1px solid var(--border)}

/* ── prodotti ────────────────────────────────────────── */
.ministat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.ministat span{font-size:12px;color:var(--muted-fg)}
.ministat b{font-size:16px;font-weight:700}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.seg button{padding:10px;color:var(--muted-fg);transition:.15s}
.seg button.on{background:var(--primary);color:#fff}
.sortbtn{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;color:var(--muted-fg);white-space:nowrap}
.sortbtn:hover{color:var(--fg)}
.sortmenu{position:absolute;top:calc(100% + 4px);right:0;min-width:150px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--shadow-lg);overflow:hidden;z-index:20}
.sortmenu button{width:100%;text-align:left;padding:10px 16px;font-size:14px;transition:.15s}
.sortmenu button:hover{background:rgba(0,0,0,.03)}
.sortmenu button.on{color:var(--primary);font-weight:500;background:rgba(0,95,115,.06)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);transition:.15s}
.pcard:hover{box-shadow:var(--shadow-md)}
.pcard.bozza{border-style:dashed;border-color:#d1d5db;opacity:.78}
.pimg{position:relative;height:176px;background:var(--muted);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;object-position:top}
.pimg .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.2),transparent)}
.pbadges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ptype{position:absolute;top:10px;right:10px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;color:#fff}
.pacts{position:absolute;bottom:10px;right:10px;display:flex;gap:6px}
.pacts button{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);transition:.15s}
.pacts button:hover{background:var(--card);color:var(--primary)}
.pacts button.del:hover{background:#fef2f2;color:#ef4444}
.pbody{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.pname{font-size:14px;font-weight:600;line-height:1.25}
.pmeta{font-size:12px;color:var(--muted-fg);margin-top:2px}
.pdesc{font-size:12px;color:var(--muted-fg);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pmetrics{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border-soft)}
.pmetrics .k{font-size:10px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.psold{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-fg)}
.inline-edit{display:inline-flex;align-items:center;gap:4px}
.inline-edit .v{font-size:14px;font-weight:600}
.inline-edit .pf,.inline-edit .sf{font-size:12px;color:var(--muted-fg)}
.inline-edit .pen{opacity:0;color:var(--muted-fg);transition:.15s}
.inline-edit:hover .pen{opacity:.5}
.inline-input{width:70px;text-align:center;font-size:14px;font-weight:600;border:1px solid rgba(0,95,115,.4);border-radius:9px;padding:2px 6px;outline:none;box-shadow:0 0 0 3px rgba(0,95,115,.1)}
.low{color:#d97706}.zero{color:#ef4444}
.lowtxt{font-size:9px;color:#f59e0b;font-weight:500;margin-top:2px}
.prow{background:var(--card);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;gap:16px;padding:16px;transition:.15s}
.prow:hover{box-shadow:var(--shadow-md)}
.prow.bozza{border-style:dashed;border-color:#d1d5db;opacity:.78}
.tag{padding:2px 6px;border-radius:6px;font-size:10px;font-weight:700;color:#fff}

/* modal */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
.modal{position:relative;width:100%;max-width:520px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:92vh}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border)}
.modal-h h2{font-size:16px;font-weight:600}
.modal-b{overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.modal-f{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:12px}
.modal-f .btn{flex:1}
.field label{display:block;margin-bottom:6px}
.imgpick{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--r);text-align:left;transition:.15s}
.imgpick:hover{border-color:rgba(0,95,115,.3)}
.imggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.imggrid button{position:relative;border-radius:var(--r-sm);overflow:hidden;border:2px solid transparent;height:80px}
.imggrid button.on{border-color:var(--primary)}
.imggrid img{width:100%;height:100%;object-fit:cover}
.imggrid .chk{position:absolute;inset:0;background:rgba(0,95,115,.35);display:flex;align-items:center;justify-content:center;color:#fff}
.confirm{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:24px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
.confirm .ico{width:48px;height:48px;border-radius:var(--r);background:#fef2f2;color:#ef4444;display:flex;align-items:center;justify-content:center;margin:0 auto}

/* ── recensioni ──────────────────────────────────────── */
.rev-hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:20px}
.rev-score{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-right:1px solid var(--border)}
.rev-score .num{font-family:var(--font-display);font-size:48px;font-weight:700;line-height:1}
.bars{display:flex;flex-direction:column;justify-content:center;gap:6px}
.bar-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-fg)}
.bar-track{flex:1;height:6px;background:var(--muted);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:#fbbf24;border-radius:999px}
.rev-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-left:20px;border-left:1px solid var(--border)}
.rev-stat{border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:4px}
.rev-stat b{font-size:16px;font-weight:700}
.rev-stat span{font-size:10px;color:var(--muted-fg);line-height:1.2}
.stars{display:inline-flex;gap:2px;align-items:center}
.avatar{width:36px;height:36px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.review{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.reply{margin-left:16px;padding:12px 16px;border-left:2px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;background:rgba(201,168,124,.09);display:flex;flex-direction:column;gap:4px}
.select{appearance:none;padding:6px 26px 6px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;outline:none}
.selwrap{position:relative}
.selwrap .ic{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted-fg);pointer-events:none}

/* ── statistiche ─────────────────────────────────────── */
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;display:flex;gap:16px;align-items:flex-start}
.kpi-ic{width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex:none}
.kpi p.l{font-size:12px;color:var(--muted-fg)}
.kpi p.v{font-size:20px;font-weight:700;margin-top:2px}
.kpi p.s{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:#059669;margin-top:4px}
.periods{display:flex;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.periods button{padding:8px 14px;font-size:12px;font-weight:500;color:var(--muted-fg);transition:.15s}
.periods button.on{background:var(--primary);color:#fff}
.chartbox{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.chartbox h3{font-size:14px;font-weight:600}
.chartbox .csub{font-size:12px;color:var(--muted-fg);margin-top:2px}
.legend{display:flex;flex-direction:column;gap:8px;flex:1}
.legend div{display:flex;align-items:center;justify-content:space-between;gap:8px}
.legend i{width:10px;height:10px;border-radius:999px;display:block;flex:none}
.readonly{display:flex;align-items:center;gap:10px;background:rgba(240,235,227,.7);border-radius:var(--r);padding:12px 16px;font-size:12px;color:var(--muted-fg)}
svg .gridline{stroke:#f0ebe3;stroke-dasharray:3 3}
svg .axis{font-size:11px;fill:#7a7060}

/* ── sponsorizza ─────────────────────────────────────── */
.hero{position:relative;border-radius:var(--r-lg);overflow:hidden;padding:32px;color:#fff;background:linear-gradient(135deg,#003d4d 0%,#005f73 50%,#007a8a 100%)}
.hero .glow{position:absolute;inset:0;opacity:.12;background:radial-gradient(circle at 20% 80%,#c9a87c 0,transparent 50%),radial-gradient(circle at 80% 20%,#c9a87c 0,transparent 50%)}
.hero .inner{position:relative;display:flex;gap:24px;align-items:center}
.hero h2{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.15}
.hero p{font-size:14px;color:rgba(255,255,255,.72);margin-top:8px;max-width:440px;line-height:1.5}
.hero .tagline{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(201,168,124,.25);color:#f0d9b5;margin-bottom:12px}
.hero .nums{display:flex;flex-direction:column;text-align:right;gap:10px;flex:none}
.hero .nums b{font-size:20px;font-weight:700;color:#f0d9b5;display:block}
.hero .nums span{font-size:12px;color:rgba(255,255,255,.6)}
.svc{text-align:left;border:2px solid var(--border);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;background:var(--card);transition:.15s}
.svc:hover{border-color:rgba(0,0,0,.18);box-shadow:var(--shadow-sm)}
.svc.on{box-shadow:var(--shadow-md)}
.svc-ic{width:44px;height:44px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex:none}
.svc-chk{width:20px;height:20px;border-radius:999px;border:2px solid rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.svc-chk.on{border-color:transparent;color:#fff}
.svc h3{font-size:16px;font-weight:600;margin-top:2px}
.svc .tl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.svc .ds{font-size:12px;color:var(--muted-fg);margin-top:6px;line-height:1.5}
.svc ul{display:flex;flex-direction:column;gap:6px}
.svc li{display:flex;gap:8px;font-size:12px;color:var(--muted-fg);line-height:1.4}
.picker-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--border-soft);cursor:pointer;transition:.15s}
.picker-row:hover{background:rgba(0,0,0,.02)}
.picker-row.on{background:rgba(0,95,115,.05)}
.cbox{width:20px;height:20px;border-radius:7px;border:2px solid rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.cbox.on{border-color:transparent;background:var(--primary)}
.sponchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:500;color:#fff}
.infobox{display:flex;gap:10px;background:rgba(240,235,227,.6);border-radius:var(--r-sm);padding:12px 16px;font-size:12px;color:var(--muted-fg);line-height:1.5}
.cta{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:var(--r-sm);font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#003d4d,#005f73);transition:.15s}
.cta:hover{opacity:.92}
.cta:active{transform:scale(.99)}
.done{max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding:48px 0}
.done .ring{width:80px;height:80px;border-radius:999px;background:rgba(0,95,115,.12);color:var(--primary);display:flex;align-items:center;justify-content:center}

/* ── placeholder ─────────────────────────────────────── */
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:16px;max-width:340px;margin:0 auto}
.ph .ico{width:56px;height:56px;border-radius:var(--r);background:rgba(0,95,115,.1);color:var(--primary);display:flex;align-items:center;justify-content:center}

/* ── mobile ──────────────────────────────────────────── */
.mobnav,.mobsheet,.mobile-detail{display:none}
.grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:900px){
  .dash-grid{grid-template-columns:1fr}
  .rev-hero{grid-template-columns:1fr}
  .rev-score{border-right:none;border-bottom:1px solid var(--border);padding-bottom:16px}
  .rev-stats{border-left:none;padding-left:0}
  .pgrid{grid-template-columns:repeat(2,1fr)}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .hero .inner{flex-direction:column;align-items:flex-start}
  .hero .nums{flex-direction:row;text-align:left;gap:24px}
}
@media (max-width:768px){
  .sidebar{display:none}
  .content{padding:16px 16px 88px}
  .header{padding:0 16px}
  .header h1{display:none}
  .mob-logo{display:block;flex:1}
  .mob-logo .logo{color:var(--sidebar-bg);font-size:13px}
  .mob-logo .logo-sub{color:var(--muted-fg)}
  .rs-txt{display:none}
  .ord-layout{flex-direction:column}
  .ord-list-col.split{flex:1;width:auto}
  .detail-col{display:none}
  .grid3{grid-template-columns:1fr}
  .grid-2col{grid-template-columns:1fr}
  .toolbar .btn-primary span{display:none}
  .mobnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;z-index:40;
    background:var(--card);border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(0,0,0,.06);
  }
  .mobnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:500;color:var(--muted-fg)}
  .mobnav button.on{color:var(--primary)}
  .mobsheet{display:flex;position:fixed;inset:0;z-index:50;flex-direction:column}
  .mobsheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
  .mobsheet .sheet{position:relative;margin-top:auto;background:var(--sidebar-bg);border-radius:24px 24px 0 0;padding-bottom:24px;box-shadow:var(--shadow-lg)}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
  .sheet-h p{color:#fff;font-size:14px;font-weight:600}
  .sheet-h span{color:rgba(255,255,255,.4);font-size:10px}
  .sheet ul{padding:12px}
  .sheet .sb-item{padding:12px 16px;margin-bottom:2px}
  .modal{max-width:none;border-radius:24px 24px 0 0;max-height:94vh}
  .overlay{align-items:flex-end;padding:0}
  .mobile-detail{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:block}
  .rev-stats{grid-template-columns:repeat(4,1fr)}
  .imggrid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:520px){
  .pgrid{grid-template-columns:1fr}
  .grid4,.grid2{grid-template-columns:1fr 1fr}
  .rev-stats{grid-template-columns:1fr 1fr}
  .hero{padding:24px}
  .hero .nums{flex-wrap:wrap;gap:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.qtybtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted-fg);background:var(--card);flex:none;transition:.15s}

.dt td{padding:12px 16px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle}

.codechip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.04em;background:var(--muted);padding:7px 12px;border-radius:8px;font-size:13px;color:var(--primary);flex:none}

.lockrow{display:flex;align-items:center;gap:14px;background:rgba(240,235,227,.7);border:1px dashed var(--border);border-radius:var(--r);padding:16px 20px}
.lockrow .ico{width:38px;height:38px;border-radius:11px;background:var(--card);color:var(--muted-fg);display:flex;align-items:center;justify-content:center;flex:none}

<script>
/* ═══ GRAFICI (SVG scritti a mano) ══════════════════════════ */
function niceMax(v,ticks){
  ticks=ticks||4;
  if(v<=0) return ticks;
  const raw=v/ticks, p=Math.pow(10,Math.floor(Math.log10(raw)));
  const steps=[1,1.5,2,2.5,3,4,5,6,8,10];
  let step=p*10;
  for(let i=0;i<steps.length;i++){ if(p*steps[i]>=raw){step=p*steps[i];break;} }
  return step*ticks;
}
function kLabel(v){
  if(v===0) return "€0";
  const k=v/1000;
  return "€"+(Number.isInteger(k)?k:String(k).replace(".",","))+"k";
}
function areaChart(data){
  const W=720,H=212,L=54,R=8,T=14,B=38;
  const max=niceMax(Math.max.apply(null,data.map(d=>d.fatturato))), n=data.length;
  const px=i=> n===1 ? (L+(W-L-R)/2) : L + i*(W-L-R)/(n-1);
  const py=v=> T + (1-v/max)*(H-T-B);
  const pts=data.map((d,i)=>[px(i),py(d.fatturato)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+" L"+pts[pts.length-1][0].toFixed(1)+" "+(H-B)+" L"+pts[0][0].toFixed(1)+" "+(H-B)+" Z";
  let g="",yl="";
  for(let i=0;i<=4;i++){
    const v=max*i/4, y=py(v);
    g+='<line class="gridline" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'"/>';
    yl+='<text class="axis" x="'+(L-10)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+kLabel(v)+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Andamento fatturato mensile">'+
    '<defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="5%" stop-color="'+TEAL+'" stop-opacity=".18"/><stop offset="95%" stop-color="'+TEAL+'" stop-opacity="0"/></linearGradient></defs>'+
    g+yl+
    '<path d="'+area+'" fill="url(#gf)"/>'+
    '<path d="'+line+'" fill="none" stroke="'+TEAL+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    data.map((d,i)=>'<g><circle cx="'+px(i).toFixed(1)+'" cy="'+py(d.fatturato).toFixed(1)+'" r="4" fill="'+TEAL+'"/>'+
      '<circle cx="'+px(i).toFixed(1)+'" cy="'+py(d.fatturato).toFixed(1)+'" r="14" fill="transparent"><title>'+d.month+': '+eurK(d.fatturato)+' · '+d.ordini+' ordini</title></circle></g>').join("")+
    data.map((d,i)=>'<text class="axis" x="'+px(i).toFixed(1)+'" y="'+(H-14)+'" text-anchor="middle">'+d.month+'</text>').join("")+
  '</svg>';
}
function barsH(data){
  const W=520,H=200,L=112,R=12,T=6,B=26;
  const max=niceMax(Math.max.apply(null,data.map(d=>d.vendute)));
  const rowH=(H-T-B)/data.length, bh=15;
  let g="";
  for(let i=0;i<=4;i++){
    const x=L+(W-L-R)*i/4;
    g+='<line class="gridline" x1="'+x.toFixed(1)+'" y1="'+T+'" x2="'+x.toFixed(1)+'" y2="'+(H-B)+'"/>'+
       '<text class="axis" x="'+x.toFixed(1)+'" y="'+(H-B+16)+'" text-anchor="middle" style="font-size:10px">'+Math.round(max*i/4)+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Prodotti più venduti">'+g+
    data.map((d,i)=>{
      const y=T+i*rowH+(rowH-bh)/2, w=(d.vendute/max)*(W-L-R);
      return '<text class="axis" x="'+(L-8)+'" y="'+(y+bh/2+3.5).toFixed(1)+'" text-anchor="end" style="font-size:10px">'+d.name+'</text>'+
        '<rect x="'+L+'" y="'+y.toFixed(1)+'" width="'+Math.max(w,2).toFixed(1)+'" height="'+bh+'" rx="6" fill="'+TEAL+'">'+
        '<title>'+d.name+': '+d.vendute+' bottiglie</title></rect>';
    }).join("")+'</svg>';
}
function donut(data){
  const size=140,c=size/2,ro=60,ri=38,gap=.05;
  const tot=data.reduce((s,d)=>s+d.value,0);
  let a=-Math.PI/2, out="";
  data.forEach(d=>{
    const sweep=(d.value/tot)*Math.PI*2, s=a+gap/2, e=a+sweep-gap/2;
    const large=(e-s)>Math.PI?1:0;
    const p=(r,ang)=>[(c+r*Math.cos(ang)).toFixed(2),(c+r*Math.sin(ang)).toFixed(2)];
    const [x1,y1]=p(ro,s),[x2,y2]=p(ro,e),[x3,y3]=p(ri,e),[x4,y4]=p(ri,s);
    out+='<path d="M'+x1+' '+y1+' A'+ro+' '+ro+' 0 '+large+' 1 '+x2+' '+y2+' L'+x3+' '+y3+' A'+ri+' '+ri+' 0 '+large+' 0 '+x4+' '+y4+' Z" fill="'+d.color+'">'+
      '<title>'+d.name+': '+d.value+' ordini</title></path>';
    a+=sweep;
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" width="140" height="140" role="img" aria-label="Distribuzione ordini per stato">'+out+
    '<text x="'+c+'" y="'+(c-2)+'" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#1a1a1a">'+tot+'</text>'+
    '<text x="'+c+'" y="'+(c+13)+'" text-anchor="middle" style="font-size:9px;fill:#7a7060">ordini</text></svg>';
}
function barsV(data){
  const W=720,H=170,L=44,R=8,T=10,B=32;
  const max=niceMax(Math.max.apply(null,data.map(d=>d.visite)));
  const step=(W-L-R)/data.length, bw=30;
  let g="";
  for(let i=0;i<=4;i++){
    const v=max*i/4, y=T+(1-i/4)*(H-T-B);
    g+='<line class="gridline" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'"/>'+
       '<text class="axis" x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+Math.round(v)+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Visite settimanali">'+g+
    data.map((d,i)=>{
      const x=L+i*step+step/2-bw/2, h=(d.visite/max)*(H-T-B), y=H-B-h;
      return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" rx="6" fill="'+GOLD+'">'+
        '<title>'+d.day+': '+d.visite+' visite</title></rect>'+
        '<text class="axis" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+d.day+'</text>';
    }).join("")+'</svg>';
}

/* ═══ REPORT & ANALYTICS ════════════════════════════════════ */
function viewReport(){
  const p=S.report.period;
  let data=GMV_MONTHLY;
  if(p==="30g") data=GMV_MONTHLY.slice(-1);
  else if(p==="3m") data=GMV_MONTHLY.slice(-3);
  const topV=S.vendors.slice().sort((a,b)=>b.gmv-a.gmv).slice(0,5).map(v=>({name:v.name,val:Math.round(v.gmv/1000)}));
  const tot=ORDER_STATUS_PIE.reduce((a,b)=>a+b.value,0);
  const kpi=(l,v,s,i,c)=>'<div class="kpi"><span class="kpi-ic" style="background:'+c+'1a;color:'+c+'">'+ic(i,16)+'</span>'+
    '<div style="flex:1;min-width:0"><p class="l">'+l+'</p><p class="v">'+v+'</p><p class="s">'+ic("up",11)+s+'</p></div></div>';
  return '<div class="wrap-lg stack">'+
    '<div class="spread" style="flex-wrap:wrap"><p style="font-size:14px;color:var(--muted-fg)">Analytics di piattaforma · aggiornato al 17 luglio 2026</p>'+
      '<div class="periods">'+[["30g","30 giorni"],["3m","3 mesi"],["6m","6 mesi"]].map(x=>'<button class="'+(p===x[0]?"on":"")+'" data-act="rep-period" data-id="'+x[0]+'">'+x[1]+'</button>').join("")+'</div></div>'+
    '<div class="grid4">'+
      kpi("GMV","€ 381k","+15,8% vs mese scorso","euro",TEAL)+
      kpi("Ordini","4.080","+15,3% vs mese scorso","cart","#2d6a4f")+
      kpi("Valore medio ordine","€ 93,40","+2,1% vs mese scorso","up",GOLD)+
      kpi("Nuovi utenti","742","+9,4% vs mese scorso","users","#7f1d1d")+
    '</div>'+
    '<div class="chartbox"><h3>Andamento GMV</h3><p class="csub" style="margin-bottom:16px">Valore lordo delle vendite in euro</p>'+areaChart(data)+'</div>'+
    '<div class="grid-2col">'+
      '<div class="chartbox"><h3>Top cantine per GMV</h3><p class="csub" style="margin-bottom:16px">Migliaia di euro nel periodo</p>'+barsH2(topV,"k€")+'</div>'+
      '<div class="chartbox"><h3>Distribuzione ordini</h3><p class="csub" style="margin-bottom:16px">Per stato di evasione</p>'+
        '<div class="row" style="gap:16px">'+donut(ORDER_STATUS_PIE)+
        '<div class="legend">'+ORDER_STATUS_PIE.map(s=>'<div><span class="row" style="gap:6px"><i style="background:'+s.color+'"></i>'+
          '<span style="font-size:12px;color:var(--muted-fg)">'+s.name+'</span></span>'+
          '<span class="row" style="gap:6px"><b style="font-size:12px">'+Math.round(s.value/tot*100)+'%</b></span></div>').join("")+'</div></div></div>'+
    '</div>'+
    '<div class="chartbox"><div class="spread" style="margin-bottom:16px"><div><h3>Traffico settimanale</h3>'+
      '<p class="csub">Visitatori unici sulla piattaforma</p></div>'+
      '<div style="text-align:right"><p style="font-size:12px;color:var(--muted-fg)">Totale settimana</p>'+
      '<p style="font-size:16px;font-weight:700">42.880</p></div></div>'+barsV(WEEKLY_VISITS)+'</div>'+
    '<div class="readonly">'+ic("eye",13)+'Sezione di sola lettura. I dati sono aggregati automaticamente su tutta la piattaforma.</div>'+
  '</div>';
}

    '<h1>'+label+'</h1>'+
    '<div class="roleswitch"><button class="rs-btn" data-act="role-toggle">'+
      '<span class="rs-badge" style="background:'+RC.color+'">'+RC.initial+'</span>'+
      '<span class="rs-txt"><p>'+RC.label+'</p><p>'+RC.role+'</p></span>'+ic("chevD",13)+'</button>'+
      (S.roleMenu?'<div class="rs-menu"><div class="rs-menu-h">Il tuo livello</div>'+
        '<div class="rs-opt on"><span class="rs-opt-ic" style="background:'+RC.color+'">'+RC.initial+'</span>'+
          '<span style="flex:1;min-width:0"><span class="rs-opt-t"><p>Manager Admin</p><span style="background:'+RC.color+'">attivo</span></span>'+
          '<span class="rs-opt-s">Opera ogni giorno sul back-office della piattaforma.</span></span></div>'+
        '<div class="rs-menu-h">Livello superiore</div>'+
        '<div class="rs-opt" style="cursor:default"><span class="rs-opt-ic" style="background:#7f1d1d">'+ic("lock",14)+'</span>'+
          '<span style="flex:1;min-width:0"><span class="rs-opt-t"><p>Admin super / owner</p><span style="background:#9ca3af">non accessibile</span></span>'+
          '<span class="rs-opt-s">RBAC, API, log &amp; audit, feature flag, commissioni &amp; contratti, cambio ruolo utente, rimborsi oltre soglia e impostazioni sistema.</span></span></div>'+
        '</div>':'')+
    '</div>'+
    '<button class="bell" aria-label="Notifiche">'+ic("bell",20)+'<b>5</b></button>'+
  '</header>';
}
function mobileNav(){
  const prim=NAV_ALL.filter(n=>RC.mobile.includes(n.id));
  const overflow=NAV_ALL.filter(n=>!RC.mobile.includes(n.id));
  return '<nav class="mobnav">'+
    prim.map(n=>'<button class="'+(S.section===n.id?"on":"")+'" data-act="nav" data-id="'+n.id+'">'+ic(n.icon,20)+n.label+'</button>').join("")+
    '<button data-act="mob-open">'+ic("menu",20)+'Altro</button></nav>'+
    (S.mobMenu?'<div class="mobsheet"><div class="scrim" data-act="mob-close"></div><div class="sheet">'+
      '<div class="sheet-h"><div><p>Menu Admin</p><span>'+RC.label+'</span></div>'+
      '<button class="iconbtn" style="color:rgba(255,255,255,.6)" data-act="mob-close">'+ic("x",20)+'</button></div>'+
      '<ul style="max-height:60vh;overflow-y:auto">'+overflow.map(n=>'<li><button class="sb-item '+(S.section===n.id?"on":"")+'" data-act="nav" data-id="'+n.id+'">'+ic(n.icon,18)+n.label+'</button></li>').join("")+
      '<li><button class="sb-logout" style="margin-top:4px">'+ic("logout",18)+'Logout</button></li></ul></div></div>':'');
}

/* ═══ ROUTER ════════════════════════════════════════════════ */
function view(){
  let body;
  if(!SECTIONS.includes(S.section) && S.section!=="sistema") S.section=RC.home;
  switch(S.section){
    case "panoramica": body=viewPanoramica(); break;
    case "catalogo":   body=viewCatalogo(); break;
    case "vendor":     body=viewVendor(); break;
    case "utenti":     body=viewUtenti(); break;
    case "ordini":     body=viewOrdini(); break;
    case "pagamenti":  body=viewPagamenti(); break;
    case "wineclub":   body=viewWineClub(); break;
    case "promozioni": body=viewPromozioni(); break;
    case "spedizioni": body=viewSpedizioni(); break;
    case "contenuti":  body=viewContenuti(); break;
    case "blog":       body=viewBlog(); break;
    case "marketing":  body=viewMarketing(); break;
    case "recensioni": body=viewRecensioni(); break;
    case "report":     body=viewReport(); break;
    case "sistema":    body=viewSistema(); break;
    default:           body=viewPanoramica();
  }
  return sidebar()+
    '<div class="main">'+header()+'<main class="content">'+body+'</main></div>'+
    mobileNav()+
    (S.ord.refund?refundModal():"");
}

/* ── Render con conservazione del focus ─────────────────────── */
const root=document.getElementById("root");
function render(){
  const a=document.activeElement;
  const key=a&&a.dataset?a.dataset.focusKey:null;
  let pos=null; try{pos=a?a.selectionStart:null}catch(e){}
  root.innerHTML=view();
  if(key){
    const el=root.querySelector('[data-focus-key="'+key+'"]');
    if(el){el.focus(); if(pos!=null){try{el.setSelectionRange(pos,pos)}catch(e){}}}
  }
}

/* ── Eventi ─────────────────────────────────────────────────── */
root.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el){ if(S.roleMenu){S.roleMenu=false;render();} return; }
  const act=el.dataset.act, id=el.dataset.id;
  if(act!=="toast") S.toast=null;

  switch(act){
    case "nav":
      if(SECTIONS.includes(id)||id==="sistema"){S.section=id;S.mobMenu=false;S.roleMenu=false;}
      break;
    case "role-toggle": S.roleMenu=!S.roleMenu; break;
    case "mob-open": S.mobMenu=true; break;
    case "mob-close": S.mobMenu=false; break;
    case "toast": S.toast=el.dataset.msg||""; break;

    /* catalogo */
    case "cat-type": S.cat.type=id; break;

    /* vendor */
    case "ven-status": S.ven.status=id; break;
    case "ven-toggle": { const v=S.vendors.find(x=>x.id===id);
      if(v){ v.status=(v.status==="attiva"?"sospesa":"attiva"); S.toast="Cantina "+v.name+(v.status==="sospesa"?" sospesa":" riattivata"); } break; }

    /* utenti */
    case "usr-type": S.usr.type=id; break;
    case "usr-toggle": { const u=S.users.find(x=>x.id===id);
      if(u){ u.status=(u.status==="attivo"?"sospeso":"attivo"); S.toast="Utente "+u.name+(u.status==="sospeso"?" sospeso":" riattivato"); } break; }

    /* ordini + rimborsi */
    case "ord-status": S.ord.status=id; break;
    case "ord-refund": S.ord.refund=id; break;
    case "ord-refund-cancel": S.ord.refund=null; break;
    case "ord-refund-confirm": { const o=S.orders.find(x=>x.id===id);
      if(o&&o.total<=REFUND_CAP){ o.status="rimborsato"; S.toast="Rimborso di "+eur(o.total)+" emesso per "+o.id; } S.ord.refund=null; break; }
    case "ord-refund-request": { const o=S.orders.find(x=>x.id===id);
      if(o){ o.status="rimborso_richiesto"; S.toast="Richiesta di rimborso inviata all'Admin per "+o.id; } S.ord.refund=null; break; }

    /* pagamenti */
    case "pay-tab": S.pay.tab=id; break;

    /* wine club */
    case "wc-tab": S.wc.tab=id; break;

    /* promozioni globali */
    case "promo-new": S.promo.creating=true; S.promo.form=EMPTY_PROMO(); break;
    case "promo-cancel": S.promo.creating=false; S.promo.form=null; break;
    case "promo-type": if(S.promo.form) S.promo.form.type=id; break;
    case "promo-create": {
      const f=S.promo.form;
      if(f&&f.code.trim()&&(f.type==="spedizione"||+f.value>0)){
        S.promos.unshift({id:"gp"+(nextId++),code:f.code.trim().toUpperCase(),type:f.type,
          value:f.type==="spedizione"?0:(+f.value),min:(+f.min||0),uses:0,expires:f.expires||"—",status:"attivo"});
        S.promo.creating=false; S.promo.form=null; S.toast="Codice sconto creato";
      }
      break;
    }
    case "promo-toggle": { const c=S.promos.find(x=>x.id===id); if(c) c.status=(c.status==="attivo"?"bozza":"attivo"); break; }
    case "promo-del": S.promos=S.promos.filter(x=>x.id!==id); break;
    case "promo-copy": { const c=S.promos.find(x=>x.id===id);
      if(c){ try{navigator.clipboard&&navigator.clipboard.writeText(c.code);}catch(e){} S.promo.copied=id; } break; }

    /* spedizioni & corrieri */
    case "ship-toggle": { const c=S.carriers.find(x=>x.id===id);
      if(c){ c.enabled=!c.enabled; S.toast=c.name+(c.enabled?" abilitato":" disabilitato"); } break; }

    /* CMS */
    case "cms-tab": S.cms.tab=id; break;
    case "cms-toggle": { const h=S.cmsHome.find(x=>x.id===id); if(h) h.visible=!h.visible; break; }
    case "cms-move": {
      const dir=parseInt(el.dataset.dir,10)||0, i=S.cmsHome.findIndex(x=>x.id===id), j=i+dir;
      if(i>=0&&j>=0&&j<S.cmsHome.length){ const a2=S.cmsHome; const t=a2[i]; a2[i]=a2[j]; a2[j]=t; }
      break;
    }

    /* blog */
    case "blog-status": S.blog.status=id; break;
    case "blog-new": S.posts.unshift({id:"b"+(nextId++),title:"Nuovo articolo senza titolo",author:"Redazione Stappando",category:"News",date:"—",status:"bozza"}); S.toast="Bozza creata"; break;
    case "blog-toggle": { const p=S.posts.find(x=>x.id===id);
      if(p){ p.status=(p.status==="pubblicato"?"bozza":"pubblicato"); if(p.status==="pubblicato"&&p.date==="—") p.date="17 lug 2026"; } break; }
    case "blog-del": S.posts=S.posts.filter(x=>x.id!==id); S.toast="Articolo eliminato"; break;

    /* marketing */
    case "mkt-toggle": { const c=S.campaigns.find(x=>x.id===id);
      if(c){ c.status=(c.status==="attiva"?"pausa":"attiva"); } break; }

    /* recensioni · moderazione */
    case "rev-status": S.rev.status=id; break;
    case "rev-approve": { const r=S.reviews.find(x=>x.id===id); if(r){ r.status="pubblicata"; S.toast="Recensione pubblicata"; } break; }
    case "rev-reject": { const r=S.reviews.find(x=>x.id===id); if(r){ r.status="rifiutata"; S.toast="Recensione rifiutata"; } break; }

    /* report */
    case "rep-period": S.report.period=id; break;
  }
  if(act!=="role-toggle") S.roleMenu=false;
  render();
});

root.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.input){
    const map={
      "cat-q":()=>S.cat.q=t.value,
      "ven-q":()=>S.ven.q=t.value,
      "usr-q":()=>S.usr.q=t.value,
      "ord-q":()=>S.ord.q=t.value,
      "promo-code":()=>{if(S.promo.form)S.promo.form.code=t.value.toUpperCase();},
      "promo-value":()=>{if(S.promo.form)S.promo.form.value=t.value;},
      "promo-min":()=>{if(S.promo.form)S.promo.form.min=t.value;},
    };
    if(map[t.dataset.input]){ S.toast=null; map[t.dataset.input](); render(); }
  }
});

root.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(S.ord.refund||S.mobMenu||S.roleMenu||S.promo.creating){
      S.ord.refund=null;S.mobMenu=false;S.roleMenu=false;S.promo.creating=false;S.promo.form=null;render();
    }
  }
});

render();

</script>
