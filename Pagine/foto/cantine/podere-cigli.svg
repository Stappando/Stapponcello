    <path d="M-20 556 C 180 520 340 552 500 536 C 640 522 730 542 820 532"/>
    <path d="M-20 600 C 180 564 340 596 500 580 C 640 566 730 586 820 576"/>
  </g>
  <g fill="#2c3823" opacity=".5">
    <circle cx="90" cy="466" r="9"/><circle cx="230" cy="452" r="9"/><circle cx="380" cy="458" r="9"/>
    <circle cx="150" cy="510" r="9"/><circle cx="300" cy="500" r="9"/><circle cx="470" cy="492" r="9"/>
    <circle cx="120" cy="554" r="10"/><circle cx="330" cy="546" r="10"/><circle cx="560" cy="536" r="10"/>
